<!doctype html><html><head><meta charset="utf-8"><title>Серая кошка и Пит: одна раскадровка</title>
<style>
html, body { margin: 0; height: 100%; background: #1d1a22; color: #eee; font-family: system-ui, "Helvetica Neue", Arial, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#stage { position: relative; height: calc(100vh - 118px); max-width: 100vw; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 14px; background: linear-gradient(90deg, #f6f3ee 50%, #24212c 50%); }
#stage.bg1 { background: radial-gradient(120% 90% at 50% 38%, #f6ecf3 0%, #dccbe2 55%, #b8a3c8 100%); } #stage.bg2 { background: #8a8f9c; }
body.cap { gap: 0; } body.cap #stage { height: 100vh; border-radius: 0; } body.cap #ui { display: none; }
#cat { position: absolute; inset: 0; width: 100%; height: 100%; }
#ui { width: min(94vw, 640px); display: grid; gap: 7px; font-size: 14px; }
#ui .row { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
#ui button, #ui select { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #fff3; background: #fff1; color: inherit; cursor: pointer; }
#ui button:hover { background: #fff2; } #ui input[type=range] { flex: 1; min-width: 160px; }
#info { opacity: .8; font-variant-numeric: tabular-nums; text-align: center; }
</style></head><body>
<div id="stage"><svg id="cat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 827" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="sh"><stop offset="0" stop-color="#2b2133" stop-opacity=".30"/><stop offset="1" stop-color="#2b2133" stop-opacity="0"/></radialGradient></defs>
<g id="gA"></g><g id="gB"></g></svg></div>
<div id="ui"><div class="row"><button id="bPrev" title="Кадр назад (←)">◀ кадр</button><button id="bPlay" title="Пуск / пауза (пробел)">▶ Играть</button><button id="bNext" title="Кадр вперёд (→)">кадр ▶</button>
<select id="speed"><option value="0.1">0,1×</option><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option selected value="1">1×</option></select>
<button id="bBg" title="Фон: проверочный (светлый+тёмный) / лавандовый / серый">фон</button><label><input type="checkbox" id="snd"> звук</label></div>
<div class="row"><input type="range" id="seek" min="0" max="0" step="1" value="0"></div><div id="info"></div></div><audio id="au" preload="auto"></audio>
<script>
const SP = __SPRITE__, PIT = __PIT__, TL = __TIMELINE__;
const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x) }, sm5 = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10) };
// лица Пита под лица серой кошки (у Пита свой набор состояний): одна раскадровка на двоих
const PITMAP = { base: 'base', pathos: 'pretend', smirk: 'pretend', roll: 'shy', interest: 'love' };

// ── кот на сцене: все детали и их начальные размеры (bbox) измеряются один раз ──
function mount(sp, g, label, faceName) {
  const el = (tag, parent, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.append(e); return e };
  const root = el('g', g), tailT = el('g', root, { transform: `translate(${sp.tailBase[0]} ${sp.tailBase[1]})` }), tailR = el('g', tailT), body = el('g', root), head = el('g', root), tilt = el('g', head);
  tailR.innerHTML = sp.tail; body.innerHTML = sp.body; tilt.innerHTML = sp.head;
  const eyes = el('g', tilt); eyes.innerHTML = sp.states.base.eyes;
  const q = c => tilt.querySelector('.' + c), c = { sp, root, tailR, body, head, tilt, eyes, label, faceName, cur: null, brows: q('brows'), dc: q('dc'), mouth: q('mouth'), mm: q('mm'), mt: q('mt'), mf: q('mf'), ml: q('ml'), wh: [...tilt.querySelectorAll('.wh')] };
  if (sp.browHairs) { c.brows.innerHTML = `<g class="bl">${sp.browHairs.l}</g><g class="br">${sp.browHairs.r}</g>`; c.bl = c.brows.querySelector('.bl'); c.br = c.brows.querySelector('.br') }
  c.headBB = head.getBBox(); c.eyeBB = eyes.getBBox(); c.whBB = c.wh.map(w => w.getBBox());
  return c;
}
const A = mount(SP, $('gA'), 'Серая кошка', n => n), P = mount(PIT, $('gB'), 'Пит', n => PITMAP[n] || 'base');
{ // Пит правее серой кошки; общий кадр и подписи
  const a = A.root.getBBox(), b = P.root.getBBox(), gap = 50, dx = a.x + a.width + gap - b.x; $('gB').setAttribute('transform', `translate(${dx} 0)`);
  const x0 = a.x - 30, x1 = b.x + dx + b.width + 30, y0 = Math.min(a.y, b.y) - 20, y1 = Math.max(a.y + a.height, b.y + b.height) + 70; A.cx = a.x + a.width / 2; P.cx = b.x + dx + b.width / 2 - dx;
  const svg = $('cat'); svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`); $('stage').style.aspectRatio = `${x1 - x0} / ${y1 - y0}`;
  for (const [c, g, x, bb] of [[A, $('gA'), A.cx, a], [P, $('gB'), P.cx, b]]) {
    const sh = document.createElementNS(NS, 'ellipse'); sh.setAttribute('cx', x); sh.setAttribute('cy', bb.y + bb.height - 4); sh.setAttribute('rx', bb.width * 0.42); sh.setAttribute('ry', 22); sh.setAttribute('fill', 'url(#sh)'); g.prepend(sh);
    const t = document.createElementNS(NS, 'text'); t.textContent = c.label; t.setAttribute('x', x); t.setAttribute('y', bb.y + bb.height + 48); t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', 30); t.setAttribute('font-weight', 700); t.setAttribute('fill', '#8a8f9c'); g.append(t);
  }
}

const faceIdx = t => { let k = 0; TL.faces.forEach((x, i) => { if (x[0] <= t) k = i }); return k };   // окно лица на момент t (кадр не зависит от истории просмотра)
function talkAmount(t) { let v = 0; for (const l of TL.lines) v = Math.max(v, sm((t - l.start + 0.05) / 0.4) * sm((l.start + l.dur + 0.3 - t) / 0.4)); return v }
function visemeAt(t) { for (const l of TL.lines) if (t >= l.start && t < l.start + l.dur) { const r = t - l.start; for (const c of l.cues) if (r >= c[0] && r < c[1]) return c[2] } return 'X' }
function setFace(c, name) { c.cur = name; const s = c.sp.states[name]; c.eyes.innerHTML = s.eyes; if (!c.bl) c.brows.innerHTML = s.brows; c.dc.innerHTML = s.deco || '' }
function setMouth(c, code, face) {
  const sp = c.sp; let e = sp.mouthTable[code]; if (code === 'X' && sp.states[face].mouth) e = { t: '', f: '', m: { d: sp.states[face].mouth, fill: 'none', sw: 6 } };
  c.mm.setAttribute('d', e.m.d); c.mm.setAttribute('fill', e.m.fill); c.mm.setAttribute('stroke-width', e.m.sw); c.mt.setAttribute('d', e.t); c.mf.setAttribute('d', e.f); c.ml.setAttribute('d', e.l ? e.l.d : '');
  if (e.l) c.ml.setAttribute('stroke-width', e.l.sw);
  c.mouth.removeAttribute('transform'); c.mt.removeAttribute('transform');
  if (code === 'D' || code === 'E') { const b = c.mouth.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height * 0.1; c.mouth.setAttribute('transform', `translate(${cx} ${cy}) scale(1.18) translate(${-cx} ${-cy})`) }   // как scene-v2-pit.css
  if (code === 'D' && e.t) { const b = c.mt.getBBox(), cx = b.x + b.width / 2; c.mt.setAttribute('transform', `translate(${cx} ${b.y}) scale(1.2) translate(${-cx} ${-b.y})`) }
}

function renderCat(c, t, ctx) {
  const { fi, since, prevI, talk, vis } = ctx, sp = c.sp, face = c.faceName(TL.faces[fi][1]), prev = c.faceName(TL.faces[prevI][1]);
  if (face !== c.cur) setFace(c, face);
  const st = sp.states[face], ps = sp.states[prev];
  setMouth(c, vis, face);
  // усы: вокруг корня у морды, как scene-v2-pit.css (верхние и нижние — с разным периодом и фазой)
  c.wh.forEach((w, i) => {
    const cl = w.getAttribute('class'), left = cl.includes('wh-l'), low = cl.includes('wh-d'), per = low ? 0.72 : 0.6, ph = low ? -0.25 : 0, b = c.whBB[i];
    const k = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + ph) / per), a = left ? lerp(4, -3, k) * talk : lerp(-4, 3, k) * talk;
    w.setAttribute('transform', `rotate(${a} ${left ? b.x + b.width : b.x} ${b.y + b.height / 2})`);
  });
  // голова: покачивание 4,4 с + кивок при речи 0,9 с (амплитуды движка ×1,5); хвост 2,8 с (×0,6); тело не масштабируется
  const sway = -1.4 * Math.cos(2 * Math.PI * t / 4.4) * 1.5, nodA = -0.4 * talk * Math.cos(2 * Math.PI * t / 0.9) * 1.5, nodY = -talk * (1 - Math.cos(2 * Math.PI * t / 0.9)) * 1.5;
  const ox = c.headBB.x + c.headBB.width / 2, oy = c.headBB.y + c.headBB.height * 0.85;
  c.head.setAttribute('transform', `translate(${ox} ${oy}) rotate(${sway + nodA}) translate(0 ${nodY}) translate(${-ox} ${-oy})`);
  const tk = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 2.8); c.tailR.setAttribute('transform', `rotate(${lerp(-9 - 4 * talk, 10 + 4 * talk, tk) * 0.6})`);
  // наклон головы, зрачки и брови по лицу — плавно: наклон 0,9 с, зрачок 0,5 с, брови 0,7 с
  const k3 = sm5((t - since) / 0.9), k5 = sm5((t - since) / 0.5), kb = sm5((t - since) / 0.7);
  c.tilt.setAttribute('transform', `rotate(${lerp(ps.tilt, st.tilt, k3) * 0.7} 297 440)`);
  const pa = lerp(ps.pupil[0], st.pupil[0], k5), pb = lerp(ps.pupil[1], st.pupil[1], k5);
  c.eyes.querySelectorAll('.pu').forEach(p => { p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 50%'; p.style.transform = `scale(${pa} ${pb})` });
  if (c.bl) for (const s of 'lr') {                                    // брови: сдвиг и поворот плавно переходят от прежнего лица к новому
    const i = s === 'l' ? 0 : 1, a = ps.brow[i], b = st.brow[i], dy = lerp(a[0], b[0], kb), rot = lerp(a[1], b[1], kb), pv = sp.browPivot[s];
    c[s === 'l' ? 'bl' : 'br'].setAttribute('transform', `translate(0 ${dy}) rotate(${rot} ${pv[0]} ${pv[1]})`);
  }
  // моргание: раз в 4,2 с и при смене лица (0,18 с)
  const per = ((t + 1.0) % 4.2) / 4.2, nat = per < 0.93 ? 1 : per < 0.95 ? lerp(1, 0.08, (per - 0.93) / 0.02) : per < 0.97 ? 0.08 : lerp(0.08, 1, (per - 0.97) / 0.03);
  const bl = t - ctx.blinkAt, forced = bl >= 0 && bl < 0.18 ? 1 - 0.92 * Math.sin(Math.PI * bl / 0.18) : 1, ey = Math.min(nat, forced), ecx = c.eyeBB.x + c.eyeBB.width / 2, ecy = c.eyeBB.y + c.eyeBB.height / 2;
  c.eyes.setAttribute('transform', `translate(${ecx} ${ecy}) scale(1 ${ey}) translate(${-ecx} ${-ecy})`);
}

function render(t) {
  const fi = faceIdx(t), ctx = { fi, since: TL.faces[fi][0], prevI: Math.max(fi - 1, 0), talk: talkAmount(t), vis: visemeAt(t) }; ctx.blinkAt = fi ? ctx.since : -9;
  renderCat(A, t, ctx); renderCat(P, t, ctx); return ctx;
}

// ── плеер ──
const CAP = location.hash === '#cap'; document.body.classList.toggle('cap', CAP);
const FPS = TL.fps, NF = Math.round(TL.total * FPS); let cur = 0, playing = false, last = 0, speed = 1;
const info = $('info'), seek = $('seek'), au = $('au'); seek.max = NF - 1; if (typeof AUDIO !== 'undefined') au.src = AUDIO;
function show(t) { const x = render(t); seek.value = Math.round(t * FPS); info.textContent = `кадр ${Math.round(t * FPS) + 1} / ${NF} · ${t.toFixed(2)} с · лицо: ${TL.faces[x.fi][1]} (Пит: ${PITMAP[TL.faces[x.fi][1]]}) · рот: ${x.vis}` }
function go(t) { cur = clamp(t, 0, (NF - 1) / FPS); show(cur); if (playing && $('snd').checked) au.currentTime = cur }
function play(on) {
  playing = on; $('bPlay').textContent = on ? '⏸ Пауза' : '▶ Играть';
  if (on) { if (cur >= (NF - 1) / FPS) cur = 0; last = performance.now(); if ($('snd').checked) { au.currentTime = cur; au.playbackRate = speed; au.play() } requestAnimationFrame(tick) } else au.pause();
}
function tick(now) { if (!playing) return; cur += (now - last) / 1000 * speed; last = now; if (cur >= (NF - 1) / FPS) { cur = 0; if ($('snd').checked) au.currentTime = 0 } show(cur); requestAnimationFrame(tick) }
$('bPlay').onclick = () => play(!playing); $('bPrev').onclick = () => { play(false); go(cur - 1 / FPS) }; $('bNext').onclick = () => { play(false); go(cur + 1 / FPS) };
seek.oninput = () => go(+seek.value / FPS); $('speed').onchange = e => { speed = +e.target.value; au.playbackRate = speed };
let bgMode = 0; const setBg = m => { bgMode = m % 3; $('stage').className = ['', 'bg1', 'bg2'][bgMode] }; $('bBg').onclick = () => setBg(bgMode + 1);
$('snd').onchange = () => { if (!$('snd').checked) au.pause(); else if (playing) { au.currentTime = cur; au.play() } };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play(!playing) } else if (e.code === 'ArrowLeft') { play(false); go(cur - (e.shiftKey ? 10 : 1) / FPS) } else if (e.code === 'ArrowRight') { play(false); go(cur + (e.shiftKey ? 10 : 1) / FPS) } });
show(0);
</script></body></html>
