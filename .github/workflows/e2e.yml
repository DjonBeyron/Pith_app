# E2E (этап 5.5-F + локальный стек): Playwright в CI.
# - job "guest": гостевые (smoke + guest) против БОЕВОЙ базы, только чтение
#   с публичным anon-ключом — проверка, что живой контент открывается.
# - job "local": весь пакет (гость + пользователь + АДМИН + права БД) против
#   локального Supabase в Docker (scripts/e2e-local.sh). Схема — из
#   supabase/migrations, данные — supabase/seed.sql; прод не трогается,
#   секреты аккаунтов не нужны. Артефакты безопасны: в трейсах только
#   локальные тест-аккаунты, которых нет нигде, кроме этой джобы.
# Триггеры: PR и push в main, каждую ночь 02:00 UTC, вручную.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # каждую ночь 02:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (гостевые, боевая база — только чтение)
        run: npx playwright test --project=mobile --project=desktop
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-guest
          path: playwright-report/
          retention-days: 14

  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Поднимает Supabase в Docker, db reset (миграции + сид) и гонит весь
      # пакет с локальными ключами и тест-аккаунтами из seed.sql.
      # E2E_PLAYER=1 — полный проход плеера (Старт → урок → звёзды): на
      # локальной базе с сидом он стабилен (на боевой — нет, см. TESTING.md)
      - name: E2E (полный, локальный Supabase — с админом, правами БД и плеером)
        run: scripts/e2e-local.sh
        env:
          E2E_PLAYER: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-local
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results-local
          path: test-results/
          retention-days: 14
