<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HETA</title>
    <!-- ОДИН цвет на всех этапах запуска — чистый чёрный #000: системный кадр iOS до стартовой картинки,
         зона статус-бара (apple-mobile-web-app-status-bar-style=black — нативный #000, CSS её не красит),
         стартовые PNG (public/splash), этот фон, сплэш, экран «нет сети», манифест, theme-color и фон
         приложения (base.css, .shellV2). Системные чёрные этапы перекрасить нельзя, поэтому под них
         подогнано всё остальное — смены цвета при старте нет. Меняешь цвет — меняй везде сразу
         (проверяет networkGuard.test.js) и перегенерируй PNG (scripts/make-brand-assets.mjs).
         color-scheme: dark — чтобы холст/оверскролл/нативные элементы до загрузки CSS не были белыми.
         Фон ДО любых скриптов и запросов: пока синхронный net-guard.js (ниже) качается, а сеть молчит,
         парсер стоит — без этого правила экран был бы белым -->
    <meta name="color-scheme" content="dark" />
    <style>html, body { margin: 0; background: #000; color-scheme: dark; }</style>
    <!-- Адрес нашего бэкенда (Supabase) для сторожа «сервер недоступен» (public/net-guard.js). Публичный URL,
         не секрет; Vite подставляет его при сборке (%VITE_SUPABASE_URL% — тот же env, что у клиента Supabase).
         Если переменной нет — остаётся текст «%VITE_…%», сторож это распознаёт и проверку не запускает -->
    <meta name="pithy-supabase-url" content="%VITE_SUPABASE_URL%" />
    <!-- Сторож белого экрана без сети (public/net-guard.js): ОБЫЧНЫЙ скрипт, синхронно в <head> — работает,
         даже если бандл не загрузился. Рисует оверлей #offlineGuard (стили .ng* ниже) -->
    <script src="/net-guard.js"></script>
    <!-- Запуск с домашнего экрана как полноценное приложение (без UI браузера).
         iOS 26 всегда оставляет системную зону высотой со статус-бар — либо
         сверху (black), либо снизу (black-translucent), поделить нельзя.
         Зона рисуется самой iOS ВНЕ страницы — сплошным нативным чёрным,
         никакой CSS внутри приложения её не красит и не растушёвывает.
         Раньше был выбран black-translucent (зона внизу, под нижним баром) —
         там она давала резкий нестыкующийся край. Теперь content=black:
         зона наверху (над статус-баром/чёлкой, видео в ленте под ней уже не
         заходит), а низ — целиком наш нижний бар без чужеродной полосы -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="HETA" />
    <meta name="theme-color" content="#000000" />
    <!-- Манифест — современный iOS строит стартовый экран веб-приложения из
         background_color + иконки (apple-touch-startup-image ниже он может
         игнорировать). После изменения нужно УДАЛИТЬ и заново добавить
         приложение на домашний экран -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <!-- Вкладка браузера: знак без подложки. SVG — основной (масштабируется и
         не тащит фон), PNG — запасной для старых браузеров -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="alternate icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
    <!-- Экран запуска iOS (пока качается HTML): однотонный ЧИСТЫЙ ЧЁРНЫЙ #000 БЕЗ лого (генерятся
         scripts/make-brand-assets.mjs, файлы ~0.5 КБ). Лого рисует только HTML-сплэш и плавно проявляет его
         из чёрного — сопрягать нативный кадр с лого и страницу до пикселя больше не нужно, нечему не совпасть.
         iOS берёт картинку ТОЛЬКО при точном совпадении размера с экраном — поэтому по ссылке на каждый iPhone -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/startup-640x1136.png">
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/startup-750x1334.png">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1242x2208.png">
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1125x2436.png">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/startup-828x1792.png">
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1242x2688.png">
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1170x2532.png">
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1284x2778.png">
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1179x2556.png">
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1290x2796.png">
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1206x2622.png">
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1320x2868.png">
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/startup-1260x2736.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat latin only — Cyrillic falls back to Comfortaa.
         Начертания 400/600/700. Шестисотое нужно обязательно: выделение
         жирным просит именно 600 (textHighlight.js), а без загруженного
         600 браузер по правилам подбора берёт БЛИЖАЙШЕЕ СВЕРХУ, то есть
         те же 700 — и «чуть тоньше» не наступает вовсе.
         Грузим НЕблокирующе (media=print → onload media=all): render-blocking
         <link> ждал бы загрузки шрифтов перед самым первым кадром — и до лого
         мелькала чернота. Сплэшу шрифты не нужны (system-ui), а контент ленты
         догрузит их за анимацией сплэша. noscript — фолбэк без JS. -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&subset=latin" rel="stylesheet" media="print" onload="this.media='all'" onerror="this.media='all'">
    <link href="https://fonts.googleapis.com/css?family=Comfortaa:400,600,700" rel="stylesheet" media="print" onload="this.media='all'" onerror="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&subset=latin" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Comfortaa:400,600,700" rel="stylesheet">
    </noscript>
    <!-- Стартовый сплэш: инлайновый CSS/SVG, рисуется на первом же кадре (до
         скачивания JS-бандла) — вместо чёрного экрана сразу видно лого. React
         подаёт сигнал window.__pithyReady, когда лента готова, и сплэш растворяется
         (opacity), открывая Рекомендации. Логотип — заглушка, заменим. -->
    <style>
      /* Фон первого кадра (#000) задан выше, в самом начале <head> (до net-guard.js) */
      /* Сплэш непрозрачный чёрный с первого кадра. Стартовый экран iOS (public/splash/startup-*.png) теперь
         ТОЖЕ чистый чёрный без лого, поэтому передача «система → страница» ничем не отличается, а лого, свечение
         и подпись версии вместе ПЛАВНО ПРОЯВЛЯЮТСЯ из чёрного одной анимацией (.splash-fade, только opacity,
         280мс ease-out, без движения). Позиция лого не зависит от JS: flex по центру окна (inset: 0) —
         никаких замеров зоны статус-бара, resize-пересчётов и позднего появления текста (версию подставляет Vite) */
      #splash {
        position: fixed; inset: 0; z-index: 2147483000;
        background: #000;
      }
      #splash .splash-fade {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        animation: splashIn 280ms ease-out;
      }
      #splash .splash-logo {
        width: 92px; height: 92px; margin-bottom: 38px;
        filter: drop-shadow(0 10px 34px rgba(158, 118, 255, 0.25));
      }
      /* Ключевой кадр только «from»: конечное значение — обычная opacity 1 */
      @keyframes splashIn { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash .splash-fade { animation: none; } }
      /* Версия — внизу по центру, тише лого (маленькая и приглушённая, чтобы не спорить с ним за внимание) */
      #splash .splash-version {
        position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: rgba(242, 245, 247, 0.4);
      }
      /* Уход — только растворение (opacity) поверх уже готовой ленты: ни масштаба, ни сдвигов */
      #splash.splash-out { animation: splashOut 350ms ease forwards; pointer-events: none; }
      @keyframes splashOut { from { opacity: 1; } to { opacity: 0; } }
      /* Экран «Нет подключения / Слабое соединение»: оверлей net-guard.js (#offlineGuard), компонент NetworkProblem.jsx
         и public/offline.html используют одни и те же классы и одну разметку кабеля (networkCableSvg.js). Лежит
         инлайном, чтобы рисоваться без бандла и без app-CSS. Блок «ng-cable-css» — копия в offline.html (сверяет
         networkGuard.test.js). Анимация: оборванный кабель (порт «режима сна» вкладки «Моя память»), только
         opacity/transform на ~6 элементах, без filter/blur; при prefers-reduced-motion стоит */
      .ngScreen {
        position: fixed; inset: 0; z-index: 2147483600; background: #000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f5f7;
      }
      .ngBody { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .ngTitle { margin: 0; font-size: 20px; font-weight: 700; }
      .ngText { margin: 0; max-width: 280px; text-wrap: balance; font-size: 14px; line-height: 1.4; color: rgba(242, 245, 247, 0.6); }
      .ngBtn {
        margin-top: 6px; padding: 13px 32px; border: none; border-radius: 12px; background: #b6fe3b;
        color: #0d0f14; font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer;
      }
      .ngBtn:disabled { opacity: 0.6; cursor: default; }
      /* ng-cable-css */
      .ngCable { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .ngWs, .ngWc, .ngStrand, .ngHalo, .ngCore, .ngStar, .ngFly { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ngWs { stroke-width: 9; opacity: 0.14; }
      .ngWc { stroke-width: 3.4; opacity: 0.9; }
      .ngL { stroke: #b6fe3b; }
      .ngR { stroke: #cfd6dc; }
      .ngStrand { stroke-width: 0.8; }
      .ngCore { stroke: #fff3c4; stroke-width: 0.7; }
      .ngHalo { stroke: #ffd257; stroke-width: 2.4; opacity: 0.32; }
      .ngStar { stroke: #fff; stroke-width: 0.7; }
      .ngFly { stroke: #ffe27a; stroke-width: 0.8; }
      .ngBolt, .ngFly { opacity: 0; }
      .ngBolt { animation: ngBoltA var(--p) steps(1, end) var(--d) infinite; }
      .ngB { animation-name: ngBoltB; }
      .ngFly { animation: ngFly var(--p) cubic-bezier(0.2, 0.6, 0.6, 1) var(--d) infinite; }
      @keyframes ngBoltA { 0% { opacity: 0; } 2% { opacity: 1; } 4% { opacity: 0; } 5% { opacity: 0.7; } 8%, 100% { opacity: 0; } }
      @keyframes ngBoltB { 0% { opacity: 0; } 1.5% { opacity: 0.9; } 3% { opacity: 0; } 52% { opacity: 0; } 53% { opacity: 1; } 54.5% { opacity: 0; } 56% { opacity: 0.5; } 57%, 100% { opacity: 0; } }
      @keyframes ngFly { 0% { transform: translate(0, 0); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(var(--mx), var(--my)); opacity: 0.9; } 26%, 100% { transform: translate(var(--tx), var(--ty)); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ngBolt, .ngFly { animation: none; } .ngBolt { opacity: 0.6; } .ngFly { opacity: 0; } }
      /* /ng-cable-css */
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash" aria-hidden="true">
      <div class="splash-fade">
      <svg class="splash-logo" viewBox="28 20 255 255" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g id="Frame 1">
      <g id="Group 11">
      <g id="Group 2">
      <path id="Vector" d="M207.812 89.4452C257.092 129.527 238.629 214.164 173.757 222.662C155.26 225.049 136.362 220.692 120.754 211.343C136.913 219.69 155.711 222.645 173.206 219.239C209.298 213.029 231.818 176.52 225.39 141.513C223.905 133.183 220.85 125.187 216.426 118.108C212.019 111.014 206.243 104.854 199.582 99.9622C192.454 94.3531 200.617 83.8527 207.812 89.4452Z" fill="#BFABFF" fill-opacity="0.29"/>

      <path id="Vector_5" d="M118.518 124.585C118.518 123.663 118.858 122.91 119.538 122.327C120.217 121.696 121.043 121.381 122.014 121.381H154.28C154.28 123.42 153.867 124.925 153.042 125.896C152.216 126.867 150.929 127.353 149.181 127.353H125.364V143.668H145.758C145.758 145.707 145.345 147.212 144.52 148.184C143.694 149.155 142.432 149.64 140.733 149.64H125.364V166.392H150.711C152.41 166.392 153.673 166.878 154.498 167.849C155.324 168.82 155.736 170.325 155.736 172.365H122.014C121.043 172.365 120.217 172.073 119.538 171.491C118.858 170.859 118.518 170.082 118.518 169.16V124.585Z" fill="#BE74FF" fill-opacity="0.53"/>

      <div class="splash-version" id="splash-version">v__APP_VERSION__</div>

    <script>
      /* Координация сплэша: показать лого сразу, убрать когда приложение готово
         (__pithyReady зовёт лента, дождавшись ПЕРВОГО РЕАЛЬНОГО КАДРА видео —
         см. FeedTab), но не раньше минимума (иначе моргнёт) и не позже
         страховки CAP (не зависаем на лого, если сеть тупит). CSS бандла в
         сборке неблокирующий (см. vite.config.js) — поэтому скрывать сплэш
         можно только когда стили реально доехали (__pithyCssReady), иначе под
         ним голый HTML. В dev помеченной ссылки [data-app-css] нет — считаем
         CSS готовым сразу. HARD — потолок на случай зависшего CSS.
         Все события пишем в window.__splashLog — DBG-панель ленты их покажет. */
      (function () {
        /* MIN: лого проявляется за 280мс (.splash-fade) — держим его ещё немного, иначе при быстрой
           готовности оно уходило бы, едва успев проявиться */
        var t0 = performance.now(), MIN = 900, CAP = 6000, HARD = 8000, done = false;
        var appReady = false, cssReady = !document.querySelector('link[data-app-css]');
        var LOG = window.__splashLog = window.__splashLog || [];
        function slog(m) { LOG.push('[' + (performance.now() / 1000).toFixed(2) + '] splash: ' + m); }
        slog('первый кадр (HTML разобран, cssReady=' + cssReady + ')');
        function hide() {
          if (done) return; done = true;
          slog('улетает');
          /* Сигнал приложению: лого ушло. Полноэкранное окно серии
             (StreakGateOverlay) до этого момента НЕ ставит ленту на паузу —
             иначе не будет первого кадра видео, по которому сплэш и
             снимается, и лого висело бы до страховки */
          window.__pithySplashGone = true;
          /* Единая точка «приложение готово» для сторожа сети (public/net-guard.js): он сам
             проверит, что #root не пуст, и уберёт оверлей «Нет подключения» */
          if (window.__netGuardDone) window.__netGuardDone();
          try { window.dispatchEvent(new Event('pithy:splash-gone')); } catch (e) { /* ignore */ }
          var el = document.getElementById('splash');
          if (!el) return;
          el.classList.add('splash-out');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
        }
        /* Шрифты (Montserrat/Comfortaa) грузятся неблокирующе: таблица стилей Google приходит позже,
           файлы начинают качаться только после раскладки со свежим CSS. Без ожидания сплэш уходил бы,
           пока подписи ещё невидимы/в запасном шрифте, и после улёта они «перескакивали». Опрашиваем
           раз в 50мс: пока не доехала таблица (media=print) или document.fonts.status === 'loading' —
           держим сплэш, но не дольше 1.2с (потом всё равно уходим) */
        var fontWait = false;
        function hideWhenFonts() {
          if (fontWait) return; fontWait = true;
          var t1 = performance.now(), logged = false;
          function tick() {
            var f = document.fonts;
            var pending = !!document.querySelector('link[href*="fonts.googleapis.com"][media="print"]') ||
              !!(f && f.status === 'loading');
            if (!pending || performance.now() - t1 > 1200) { hide(); return; }
            if (!logged) { logged = true; slog('ждём шрифты (до 1200мс)'); }
            setTimeout(tick, 50);
          }
          requestAnimationFrame(function () { setTimeout(tick, 0); });
          setTimeout(function () { if (!done && !logged) tick(); }, 200);
        }
        function maybeHide() { if (appReady && cssReady) hideWhenFonts(); }
        window.__pithyCssReady = function () {
          if (!cssReady) slog('CSS бандла загружен');
          cssReady = true; maybeHide();
        };
        var cssLink = document.querySelector('link[data-app-css]');
        if (cssLink) cssLink.addEventListener('error', window.__pithyCssReady);
        window.__pithyReady = function (why) {
          slog('приложение готово: ' + (why || '?'));
          setTimeout(function () { appReady = true; maybeHide(); },
            Math.max(0, MIN - (performance.now() - t0)));
        };
        setTimeout(function () {
          if (done || appReady) return;
          slog('CAP ' + CAP + 'мс — не ждём дольше');
          appReady = true; maybeHide();
        }, CAP);
        setTimeout(hide, HARD);
      })();
    </script>
