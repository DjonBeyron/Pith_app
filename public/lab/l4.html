<!doctype html>
<html lang="ru" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- ЛАБ-4: страница «Лаборатории запуска» (Админ → «Старт», /lab/index.html). НИ ОДНОЙ ссылки apple-touch-startup-image, страница чёрная: что iOS показывает по умолчанию.
         Без manifest, без color-scheme и theme-color (чистый эксперимент). Тест-страж: src/features/admin/start/startLab.test.js -->
    <title>ЛАБ-4 без картинок</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ЛАБ-4" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      .lab { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: labIn 0.5s ease 700ms forwards; color: #fff; font: 700 64px/1 -apple-system, system-ui, sans-serif; }
      @keyframes labIn { to { opacity: 1; } }
    </style>
  </head>
  <body style="margin:0;background:#000">
    <div class="lab">ЛАБ-4</div>
  </body>
</html>
