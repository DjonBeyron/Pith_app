         Без manifest, без color-scheme и theme-color (чистый эксперимент). Тест-страж: src/features/admin/start/startLab.test.js -->
    <title>ЛАБ-5 быстрый кеш</title>

    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      .lab { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation: labIn 0.5s ease 700ms forwards; color: #fff; font: 700 64px/1 -apple-system, system-ui, sans-serif; }
      .labSw { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; font: 400 13px/1.3 -apple-system, system-ui, sans-serif; color: #9a9a9a; }
      @keyframes labIn { to { opacity: 1; } }
    </style>
  </head>
  <body style="margin:0;background:#000">
    <div class="lab">ЛАБ-5<div class="labSw" id="sw">service worker: проверяю…</div></div>
    <script>
      // Регистрируем лабораторный воркер (scope /lab/); он кладёт эту страницу в кеш при установке
      // и со следующих запусков отдаёт её из кеша. Подпись — только чтобы пользователь видел, прогрето ли
      var el = document.getElementById('sw')
      function show() { el.textContent = navigator.serviceWorker.controller ? 'service worker активен (прогрето)' : 'service worker: ещё не активен - закрой и запусти ещё раз' }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/lab/lab-sw.js', { scope: '/lab/' }).then(function () { return navigator.serviceWorker.ready }).then(show, function () { el.textContent = 'service worker: не удалось зарегистрировать' })
        if (navigator.serviceWorker.controller) show()
      } else { el.textContent = 'service worker: не поддерживается' }
    </script>
  </body>
