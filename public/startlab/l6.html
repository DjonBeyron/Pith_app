<!doctype html>
<html lang="ru" style="background:#000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- ЛАБ-6: страница «Лаборатории запуска» (Админ → «Старт»). Как ЛАБ-1 (чёрные PNG, без скриптов, БЕЗ service worker), но с
         Cache-Control: public, max-age=86400 (vercel.json: /startlab/*): со второго запуска страницу отдаёт HTTP-кеш браузера — самый
         короткий путь, какой возможен без воркера на пути. Проверяет: моргает ли iOS, когда воркера нет вообще, а страница уже в кеше.
         Лежит вне /lab/ (там no-cache). Без manifest, color-scheme и theme-color. Тест-страж: src/features/admin/start/startLab.test.js -->
    <title>ЛАБ-6 HTTP-кеш без воркера</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ЛАБ-6" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <style>
      html, body { margin: 0; height: 100%; background: #000; }
