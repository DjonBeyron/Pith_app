<title>Кит и Мия: знакомство</title>
<style>
:root{color-scheme:dark light}
body{margin:0;background:#0b0d10;color:#e7e9ee;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
#phone{position:relative;width:min(360px,92vw);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#222;box-shadow:0 8px 40px #000a}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.catbox{position:absolute;pointer-events:none}.catbox>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform}
.cat .eyes-closed{display:none}.cat.blink .ey{display:none}.cat.blink .eyes-closed{display:inline}
#bubble{position:absolute;left:14px;right:14px;top:56px;background:#fff;color:#1b1630;border-radius:18px;padding:10px 14px 12px;box-shadow:0 4px 18px #0006;opacity:0;transition:opacity .18s;font-weight:600}
#bubble.on{opacity:1}
#bubble small{display:block;font-weight:700;font-size:11px;letter-spacing:.04em;color:#7a5bd0;margin-bottom:2px}
#bubble .tr{display:block;font-weight:500;font-size:12px;color:#6b6780;margin-top:4px}
#bubble:after{content:"";position:absolute;bottom:-9px;left:var(--tail,25%);border:9px solid transparent;border-top-color:#fff;border-bottom:0}
#bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{background:#b6fe3b;color:#10140a;border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer}
label{display:flex;align-items:center;gap:6px;color:#aab}
p.note{max-width:440px;color:#9aa0ad;margin:0;text-align:center;font-size:12.5px}

  girl: { REST: [[428, 654], [468, 674], [506, 680], [540, 668], [562, 642], [570, 610], [564, 578], [550, 554], [532, 544]], WIDTHS: [58, 58, 56, 53, 50, 46, 42, 38, 34], STRIPES: [], TIP_FROM: 0.64 },   // без полосок: однотонный хвост с карамельным кончиком
}
let REST, WIDTHS, SEG, N
let STRIPES, TIP_FROM   // доли длины: тёмные поперечные полоски и начало тёмного кончика (из профиля)
function useTailProfile(name = 'boy') {
  const P = PROFILES[name]; REST = P.REST; WIDTHS = P.WIDTHS; STRIPES = P.STRIPES || [[0.27, 0.35], [0.47, 0.55], [0.67, 0.75]]; TIP_FROM = P.TIP_FROM || 0.9
  SEG = REST.slice(1).map((p, i) => ({ len: Math.hypot(p[0] - REST[i][0], p[1] - REST[i][1]), ang: Math.atan2(p[1] - REST[i][1], p[0] - REST[i][0]) }))
  N = SEG.length
}
useTailProfile('boy')
const PER = 4                       // выборок на сегмент
const TAIL_COLORS = { fill: '#bc82fa', stripe: '#9656e0', line: '#582e99', lineW: 7 }
const f1 = v => (Math.round(v * 10) / 10).toString()

function chain(theta) {
  const pts = [REST[0].slice()]
  let cum = 0
  for (let i = 0; i < N; i++) {
    cum += theta[i] || 0
    const a = SEG[i].ang + cum
    pts.push([pts[i][0] + SEG[i].len * Math.cos(a), pts[i][1] + SEG[i].len * Math.sin(a)])
  }
  return pts
}
function crPoint(p0, p1, p2, p3, u) {   // Catmull-Rom
  const u2 = u * u, u3 = u2 * u
  return [0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * u + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u3))
}
function dense(pts) {
  const out = []
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[i + 1], d = pts[Math.min(pts.length - 1, i + 2)]
    for (let k = 0; k < PER; k++) {
      const u = k / PER
      out.push({ p: crPoint(a, b, c, d, u), w: WIDTHS[i] + (WIDTHS[i + 1] - WIDTHS[i]) * u })
    }
  }
  out.push({ p: pts[pts.length - 1].slice(), w: WIDTHS[WIDTHS.length - 1] })
  return out
}
function tailGeometry(theta) {
  const c = dense(chain(theta))
  const L = [], R = []
  for (let i = 0; i < c.length; i++) {
    const a = c[Math.max(0, i - 1)].p, b = c[Math.min(c.length - 1, i + 1)].p
    let tx = b[0] - a[0], ty = b[1] - a[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m
    const nx = -ty, ny = tx, h = c[i].w / 2
    L.push([c[i].p[0] + nx * h, c[i].p[1] + ny * h]); R.push([c[i].p[0] - nx * h, c[i].p[1] - ny * h])
    c[i].t = [tx, ty]; c[i].n = [nx, ny]
  }
  // скруглённый кончик: дуга от левого края через направление хвоста к правому
  const last = c[c.length - 1], r = last.w / 2, cap = []
  for (let k = 1; k < 8; k++) { const al = Math.PI * k / 8; cap.push([last.p[0] + last.n[0] * Math.cos(al) * r + last.t[0] * Math.sin(al) * r, last.p[1] + last.n[1] * Math.cos(al) * r + last.t[1] * Math.sin(al) * r]) }
  const P = pts => pts.map(q => `${f1(q[0])} ${f1(q[1])}`).join('L')
  const body = `M${P(L)}L${P(cap)}L${P(R.slice().reverse())}Z`
  const n = c.length
  // полоски и тёмный кончик лежат поверх заливки и обводки, поэтому отступают внутрь на полширины обводки — иначе закрыли бы её внутреннюю половину
  const IN = TAIL_COLORS.lineW / 2 - 0.2
  const Li = [], Ri = []
  for (let i = 0; i < n; i++) { const h = Math.max(1, c[i].w / 2 - IN); Li.push([c[i].p[0] + c[i].n[0] * h, c[i].p[1] + c[i].n[1] * h]); Ri.push([c[i].p[0] - c[i].n[0] * h, c[i].p[1] - c[i].n[1] * h]) }
  const band = (a, b) => { const i0 = Math.round(a * (n - 1)), i1 = Math.round(b * (n - 1)); return `M${P(Li.slice(i0, i1 + 1))}L${P(Ri.slice(i0, i1 + 1).reverse())}Z` }
  const tipI = Math.round(TIP_FROM * (n - 1)), rr = Math.max(1, r - IN), capI = []
  for (let k = 1; k < 8; k++) { const al = Math.PI * k / 8; capI.push([last.p[0] + last.n[0] * Math.cos(al) * rr + last.t[0] * Math.sin(al) * rr, last.p[1] + last.n[1] * Math.cos(al) * rr + last.t[1] * Math.sin(al) * rr]) }
  const tip = `M${P(Li.slice(tipI))}L${P(capI)}L${P(Ri.slice(tipI).reverse())}Z`
  // два узла вместо шести: контур (заливка+обводка) и все полоски одним путём
  return { body, stripes: STRIPES.map(([a, b]) => band(a, b)).join('') + tip }
}
// Разметка хвоста в позе покоя (для статичного SVG и листов)
function tailMarkup(theta = new Array(N).fill(0)) {
  const g = tailGeometry(theta), C = TAIL_COLORS
  return `<g class="tail"><path class="tl-fill" d="${g.body}" fill="${C.fill}" stroke="${C.line}" stroke-width="${C.lineW}" stroke-linejoin="round"/><path class="tl-s" d="${g.stripes}" fill="${C.stripe}"/></g>`
}
// Углы изгиба суставов во времени. talk 0…1 — насколько кот «увлечён» речью; kicks — недавние подёргивания [{t0, sign}]; phase — сдвиг, чтобы коты не вилялись синхронно
function tailTheta(t, { talk = 0, kicks = [], phase = 0 } = {}) {
  const th = new Array(N).fill(0)
  const wi = 2 * Math.PI / 3.1, wt = 2 * Math.PI * 2.3
  for (let k = 0; k < N; k++) {
    const g = k / (N - 1)
    const idle = (0.012 + 0.10 * g) * Math.sin(wi * t - 0.55 * k + phase) + 0.05 * g * Math.sin(2 * Math.PI * t / 5.3 + phase)
    const hot = (0.025 + 0.15 * g) * Math.sin(wt * t - 0.7 * k + phase) - 0.05 * g
    th[k] = idle * (1 - talk) + hot * talk
    for (const kk of kicks) {
      const s = t - kk.t0 - 0.035 * k
      if (s > 0 && s < 0.9) th[k] += kk.sign * 0.26 * g * Math.exp(-s / 0.15) * (1 - Math.exp(-s / 0.02))
    }
  }
  return th
}

useTailProfile('boy');
// ── время ──
let T=0;const timeline=LINES.map(l=>{const e={...l,t0:T,cues:l.mouthCues.map(c=>[T+c[0],T+c[1],c[2]])};T+=l.dur+GAP;return e});
const TOTAL=T+TAILEND;window.TOTAL=TOTAL;
const WIN=WINDOWS.map(w=>{const L=timeline[w.line],t0=L.t0+w.from,t1=w.to==='end'?L.t0+L.dur+GAP*.5:L.t0+w.to;return{who:w.who,state:w.state,t0,t1}});
// ── состояния мимики ──
function activeState(who,t){if(!CFG.extra)return'base';let r=null;for(const w of WIN)if(w.who===who&&t>=w.t0&&t<w.t1&&(!r||w.t0>=r.t0))r=w;return r?r.state:'base'}
const BOUNDS={a:[],b:[]};for(const w of WIN)BOUNDS[w.who].push(w.t0,w.t1);for(const k in BOUNDS)BOUNDS[k].sort((x,y)=>x-y);
// последнее изменение состояния до t: когда и из какого состояния (для плавных переходов зрачка и наклона)
function lastChange(who,t){
  for(let i=BOUNDS[who].length-1;i>=0;i--){const b=BOUNDS[who][i];if(b>t)continue;const p=activeState(who,b-1e-4),c=activeState(who,b+1e-4);if(p!==c)return{tb:b,prev:p}}
  return{tb:-9,prev:'base'};
}
function nearChange(who,t){for(const b of BOUNDS[who])if(t>=b-.10&&t<b+.03&&activeState(who,b-1e-4)!==activeState(who,b+1e-4))return true;return false}
// ── сцена ──
const cats={};for(const w of ['a','b']){const e=document.getElementById('cat-'+w);if(e){cats[w]=e;e.__ey=e.querySelector('.ey');e.__br=e.querySelector('.brows');e.__dc=e.querySelector('.dc')}}
const bub=document.getElementById('bubble');
function applyState(el,who,name){
  if(el.__st===name)return;el.__st=name;const S=PACKS[who].states[name];
  el.__ey.innerHTML=S.eyes;if(el.__br)el.__br.innerHTML=S.brows||'';if(el.__dc)el.__dc.innerHTML=S.deco||'';
  el.__pu=[...el.__ey.querySelectorAll('.pu')];el.__pk=null;el.__mk=null;
}
function setPupil(el,sx,sy){
  const k=sx.toFixed(2)+','+sy.toFixed(2);if(el.__pk===k)return;el.__pk=k;
  for(const p of el.__pu){const x=+p.dataset.x,y=+p.dataset.y;p.setAttribute('transform',(sx===1&&sy===1)?'':'translate('+x+' '+y+') scale('+sx+' '+sy+') translate('+(-x)+' '+(-y)+')')}
}
function setMouth(el,who,shape){
  const S=PACKS[who].states[el.__st],ov=shape==='X'&&S.mouth;const key=shape+'|'+(ov?el.__st:'');
  const m=el.__m||(el.__m={mm:el.querySelector('.mm'),mt:el.querySelector('.mt'),mf:el.querySelector('.mf'),ml:el.querySelector('.ml')});
  if(el.__mk===key)return;el.__mk=key;
  const e=ov?{m:{d:S.mouth,fill:'none',sw:6},t:'',f:'',l:null}:MOUTH_TABLE[shape];
  m.mm.setAttribute('d',e.m.d);m.mm.setAttribute('fill',e.m.fill);m.mm.setAttribute('stroke-width',e.m.sw);
  m.mt.setAttribute('d',e.t);m.mf.setAttribute('d',e.f);
  if(e.l){m.ml.setAttribute('d',e.l.d);m.ml.setAttribute('stroke-width',e.l.sw)}else m.ml.setAttribute('d','');
}
function placeParts(el,body,face,rot){
  const B=el.__B||(el.__B=el.querySelector('.body-g')),F=el.__F||(el.__F=el.querySelector('.face-g'));
  if(!el.__O){F.style.transformOrigin=((297+36)/615*100).toFixed(2)+'% '+((440-44)/715*100).toFixed(2)+'%';el.__O=1}
  const b='translate3d(0,'+(body/RIGH*100).toFixed(3)+'%,0)',f='translate3d(0,'+(face/RIGH*100).toFixed(3)+'%,0) rotate('+rot.toFixed(2)+'deg)';
  if(el.__bs!==b){B.style.transform=b;el.__bs=b}if(el.__fs!==f){F.style.transform=f;el.__fs=f}
}
const OPEN={X:0,A:0,B:.3,C:.6,D:1,E:.55,F:.35,G:.25,H:.5};
const BLINK={a:[2.6,6.1,10.4,15.2,19.7],b:[3.9,8.2,12.7,17.5]};
const blinking=(who,t)=>BLINK[who].some(b=>t>=b&&t<b+.13);
function lineAt(t){let r=null;for(const l of timeline)if(l.t0<=t)r=l;return r}
function tailUpdate(el,who,t){
  const L=lineAt(t);let talk=0,kicks=[];
  if(L&&L.who===who){talk=Math.min(1,(t-L.t0)/.3)*Math.max(0,Math.min(1,1-(t-(L.t0+L.dur))/.5));
    if(t<L.t0+L.dur)for(let i=0;i<L.cues.length;i++){const c=L.cues[i];if(c[0]>t)break;if(t-c[0]<.9&&'CDE'.includes(c[2]))kicks.push({t0:c[0],sign:i%2?1:-1})}}
  const idle=!(talk>.01||kicks.length),still=LITE&&idle;                       // lite: в покое хвост неподвижен (поза покоя), без пересчёта
  const hz=(idle?TAIL_HZ_IDLE:TAIL_HZ_TALK),slot=still?-1:Math.floor(t*hz);
  if(el.__tslot===slot)return;el.__tslot=slot;
  useTailProfile(PACKS[who].tailProfile);
  const g=tailGeometry(tailTheta(still?0:t,{talk,kicks,phase:who==='b'?1.7:0}));
  const c=el.__tl||(el.__tl={f:el.querySelector('.tl-fill'),s:el.querySelector('.tl-s')});
  c.f.setAttribute('d',g.body);c.s.setAttribute('d',g.stripes);
}
window.renderAt=function(t){
  const cur=timeline.find(l=>t>=l.t0&&t<l.t0+l.dur+GAP*.6);
  const speaking=cur&&t<cur.t0+cur.dur?cur.who:null;
  for(const who of Object.keys(cats)){
    const el=cats[who];const st=activeState(who,t);applyState(el,who,st);
    const shape=speaking===who?(()=>{for(const c of cur.cues)if(t>=c[0]&&t<c[1])return c[2];return'X'})():'X';
    setMouth(el,who,shape);
    el.classList.toggle('blink',blinking(who,t)||nearChange(who,t));
    // реакция зрачка и наклон головы по состоянию — плавно (0,22 с) от предыдущего к текущему
    const lc=lastChange(who,t),e=sstep((t-lc.tb)/.22),Sc=PACKS[who].states[st],Sp=PACKS[who].states[lc.prev];
    let sx=1,sy=1;
    if(CFG.pupil){sx=Sp.pupil[0]+(Sc.pupil[0]-Sp.pupil[0])*e;sy=Sp.pupil[1]+(Sc.pupil[1]-Sp.pupil[1])*e;if(st==='love'&&!LITE){const pl=1+.06*Math.sin(t*2*Math.PI*1.7);sx*=pl;sy*=pl}}
    setPupil(el,sx,sy);
    const tilt=Sp.tilt+(Sc.tilt-Sp.tilt)*sstep((t-lc.tb)/.3);
    const br=LITE?0:Math.sin(Math.floor(t*BREATH_HZ)/BREATH_HZ*2*Math.PI/3.4+(who==='b'?1.3:0))*1.6;
    const open=OPEN[shape]||0,bob=speaking===who?-open*4.6:0,rot=(speaking===who?Math.sin(t*5.2)*.9:0)+tilt;
    placeParts(el,br,br*1.25+bob,rot);tailUpdate(el,who,t);
  }
  const shown=cur&&t<cur.t0+cur.dur+.12?cur:null;
  if(bub.__k!==shown){bub.__k=shown;
    if(shown){bub.classList.add('on');bub.querySelector('small').textContent=shown.name;bub.querySelector('.tx').textContent=shown.text;bub.querySelector('.tr').textContent=shown.tr;bub.style.setProperty('--tail',shown.who==='a'?'24%':'70%')}
    else bub.classList.remove('on')}
  return speaking;
};
// ── запуск ──
let raf=0,t0=0,playing=false,spoken=new Set();
function frame(now){
  const t=(now-t0)/1000;
  for(const l of timeline)if(t>=l.t0&&!spoken.has(l)){spoken.add(l);if(l.audio){const a=new Audio(l.audio);a.play().catch(()=>{})}}
  const who=window.renderAt(t);document.getElementById('who').textContent=(who?('говорит: '+PACKS[who].id):'')+(LITE?' · lite':'');
  if(t>TOTAL){playing=false;document.getElementById('play').textContent='▶ Ещё раз';window.renderAt(0);return}
  raf=requestAnimationFrame(frame);
}
document.getElementById('play').onclick=()=>{
  if(playing){cancelAnimationFrame(raf);playing=false;document.getElementById('play').textContent='▶ Играть';window.renderAt(0);return}
  spoken=new Set();t0=performance.now();playing=true;document.getElementById('play').textContent='■ Стоп';raf=requestAnimationFrame(frame);
};
document.getElementById('cfgPupil').checked=CFG.pupil;document.getElementById('cfgExtra').checked=CFG.extra;
document.getElementById('cfgPupil').onchange=e=>{CFG.pupil=e.target.checked;if(!playing)window.renderAt(.0)};
document.getElementById('cfgExtra').onchange=e=>{CFG.extra=e.target.checked;if(!playing)window.renderAt(0)};
window.renderAt(0);
</script></body></html>
