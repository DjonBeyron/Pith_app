<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>HETA</title>
<!-- Офлайн-фолбэк: сервис-воркер (push-sw.js) отдаёт эту страницу, когда загрузка приложения не удалась из-за
     сети (нет сети СРАЗУ, молчит сеть — через 2.5с). Самодостаточный файл: в кэше воркера лежит только он, поэтому
     никаких внешних шрифтов/картинок/скриптов — стили и SVG инлайном. Вид = оверлей index.html (.ng*): блок
     «ng-cable-css» и разметка кабеля (svg.ngCable) — КОПИИ (из index.html и src/app/networkCableSvg.js), их
     сверяет networkGuard.test.js. Кнопка «Повторить» — обычная ссылка (работает даже без JS); скрипт ниже
     перезагружает страницу сам, как только сеть отвечает (событие online или удачный пинг /favicon.svg) -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; }
  .ngScreen {
    position: fixed; inset: 0; background: #0b0d10; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2f5f7;
  }
  .ngBody { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ngTitle { margin: 0; font-size: 20px; font-weight: 700; }
  .ngText { margin: 0; max-width: 260px; font-size: 14px; line-height: 1.4; color: rgba(242, 245, 247, 0.6); }
  .ngBtn {
    margin-top: 6px; padding: 13px 32px; border-radius: 12px; background: #b6fe3b; color: #0d0f14;
    font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-decoration: none;
  }
  /* ng-cable-css */
  .ngCable { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .ngWs, .ngWc, .ngStrand, .ngHalo, .ngCore, .ngStar, .ngFly { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ngWs { stroke-width: 9; opacity: 0.14; }
  .ngWc { stroke-width: 3.4; opacity: 0.9; }
  .ngL { stroke: #b6fe3b; }
  .ngR { stroke: #cfd6dc; }
  .ngStrand { stroke-width: 0.8; }
  .ngCore { stroke: #fff3c4; stroke-width: 0.7; }
  .ngHalo { stroke: #ffd257; stroke-width: 2.4; opacity: 0.32; }
  .ngStar { stroke: #fff; stroke-width: 0.7; }
  .ngFly { stroke: #ffe27a; stroke-width: 0.8; }
  .ngBolt, .ngFly { opacity: 0; }
  .ngBolt { animation: ngBoltA var(--p) steps(1, end) var(--d) infinite; }
  .ngB { animation-name: ngBoltB; }
  .ngFly { animation: ngFly var(--p) cubic-bezier(0.2, 0.6, 0.6, 1) var(--d) infinite; }
  @keyframes ngBoltA { 0% { opacity: 0; } 2% { opacity: 1; } 4% { opacity: 0; } 5% { opacity: 0.7; } 8%, 100% { opacity: 0; } }
  @keyframes ngBoltB { 0% { opacity: 0; } 1.5% { opacity: 0.9; } 3% { opacity: 0; } 52% { opacity: 0; } 53% { opacity: 1; } 54.5% { opacity: 0; } 56% { opacity: 0.5; } 57%, 100% { opacity: 0; } }
  @keyframes ngFly { 0% { transform: translate(0, 0); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(var(--mx), var(--my)); opacity: 0.9; } 26%, 100% { transform: translate(var(--tx), var(--ty)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ngBolt, .ngFly { animation: none; } .ngBolt { opacity: 0.6; } .ngFly { opacity: 0; } }
  /* /ng-cable-css */
</style>
</head>
<body>
<div class="ngScreen" role="alert">
<svg class="ngCable" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<g transform="translate(195 422) rotate(-63.4)">
<path class="ngWs ngL" d="M-760 0C-727.2 26.7 -702.8 26.7 -670 0S-612.8 -26.7 -580 0S-522.8 26.7 -490 0S-432.8 -26.7 -400 0S-342.8 26.7 -310 0S-252.8 -26.7 -220 0C-203.6 13.3 -189.3 20 -175 20"/>
<path class="ngWc ngL" d="M-760 0C-727.2 26.7 -702.8 26.7 -670 0S-612.8 -26.7 -580 0S-522.8 26.7 -490 0S-432.8 -26.7 -400 0S-342.8 26.7 -310 0S-252.8 -26.7 -220 0C-203.6 13.3 -189.3 20 -175 20"/>
<g transform="translate(-175 20) scale(2.2)">
<path class="ngStrand" stroke="#4fb3ee" d="M0 0Q7.8 -6 14 -7.7"/><path class="ngStrand" stroke="#b6fe3b" d="M0 0Q5.4 4 10.3 3.8"/><path class="ngStrand" stroke="#f1bd3c" d="M0 0Q7.6 8.9 9.9 13.8"/>
<g class="ngBolt" style="--p:3.7s;--d:0.4s"><path class="ngHalo" d="M 0 0 L 2.6 -0.7 L 5.7 -1.4 L 8.6 -4 L 11.5 -5.9 L 13.8 -7.4"/><path class="ngCore" d="M 0 0 L 2.6 -0.7 L 5.7 -1.4 L 8.6 -4 L 11.5 -5.9 L 13.8 -7.4"/><path class="ngStar" d="M 0 0 L 2.5 1.1 M 0 0 L -0.3 2.3 M 0 0 L -3 -0.1 M 0 0 L 0.5 -2.1"/></g>
<g class="ngBolt ngB" style="--p:5.9s;--d:2.2s"><path class="ngHalo" d="M 0 0 L 3 0.3 L 6.5 -0.8 L 10.9 -0.8 L 15.4 -0.4 L 18.4 -0.9"/><path class="ngCore" d="M 0 0 L 3 0.3 L 6.5 -0.8 L 10.9 -0.8 L 15.4 -0.4 L 18.4 -0.9"/></g>
<line class="ngFly" x2="2" y2="0.1" style="--p:2.9s;--d:0.2s;--mx:5.4px;--my:2.7px;--tx:11.1px;--ty:0.5px"/>
</g>
<g transform="rotate(180)">
<path class="ngWs ngR" d="M-760 0C-727.2 26.7 -702.8 26.7 -670 0S-612.8 -26.7 -580 0S-522.8 26.7 -490 0S-432.8 -26.7 -400 0S-342.8 26.7 -310 0S-252.8 -26.7 -220 0C-203.6 13.3 -189.3 20 -175 20"/>
<path class="ngWc ngR" d="M-760 0C-727.2 26.7 -702.8 26.7 -670 0S-612.8 -26.7 -580 0S-522.8 26.7 -490 0S-432.8 -26.7 -400 0S-342.8 26.7 -310 0S-252.8 -26.7 -220 0C-203.6 13.3 -189.3 20 -175 20"/>
<g transform="translate(-175 20) scale(2.2)">
<path class="ngStrand" stroke="#b6fe3b" d="M0 0Q5.4 -5.6 7.5 -9.4"/><path class="ngStrand" stroke="#f1bd3c" d="M0 0Q9 4.4 17.9 1.8"/><path class="ngStrand" stroke="#4fb3ee" d="M0 0Q6.5 7.6 10.2 9.5"/>
<g class="ngBolt ngB" style="--p:4.6s;--d:1.3s"><path class="ngHalo" d="M 0 0 L 3.6 -2.1 L 7.9 -3.4 L 11.6 -2.8 L 15.4 -4.2"/><path class="ngCore" d="M 0 0 L 3.6 -2.1 L 7.9 -3.4 L 11.6 -2.8 L 15.4 -4.2"/><path class="ngStar" d="M 0 0 L 0.6 2.6 M 0 0 L -2.5 1.2 M 0 0 L -0.1 -2.4 M 0 0 L 2.8 -0.8"/></g>
<g class="ngBolt" style="--p:3.1s;--d:3.6s"><path class="ngHalo" d="M 0 0 L 3.5 2.3 L 6.6 2.9 L 9.7 4.2 L 12.8 6.3"/><path class="ngCore" d="M 0 0 L 3.5 2.3 L 6.6 2.9 L 9.7 4.2 L 12.8 6.3"/></g>
<line class="ngFly" x2="1.9" y2="-0.6" style="--p:4.3s;--d:1.7s;--mx:5px;--my:1.1px;--tx:8.6px;--ty:-2.5px"/>
</g>
</g>
</g>
</svg>
<div class="ngBody">
<h1 class="ngTitle" id="title">Нет интернета</h1>
<p class="ngText">Проверь соединение — мы подключимся сами</p>
<a class="ngBtn" href="/" id="retry">Повторить</a>
</div>
</div>
<script>
  /* «Повторить» = перезагрузка; сеть вернулась — перезагружаемся сами. Wi-Fi без интернета события online не
     даёт (navigator.onLine там true), поэтому раз в 3с стучимся крошечным запросом мимо кэша (запросы воркер
     не перехватывает, только загрузку страницы); ответила картинка — говорим воркеру «сеть жива» (он на ~20с
     перестаёт торопиться с офлайн-страницей) и перезагружаемся */
  var title = document.getElementById('title')
  function sync() { title.textContent = navigator.onLine === false ? 'Нет интернета' : 'Слабый интернет' }
  sync()
  window.addEventListener('offline', sync)
  window.addEventListener('online', function () { location.reload() })
  document.getElementById('retry').addEventListener('click', function (e) { e.preventDefault(); location.reload() })
  function next() { setTimeout(probe, 3000) }
  function probe() {
    if (document.hidden || typeof fetch !== 'function') return next()
    var ac = typeof AbortController === 'function' ? new AbortController() : null
    var t = setTimeout(function () { if (ac) ac.abort() }, 2500)
    fetch('/favicon.svg?_=' + Date.now(), { cache: 'no-store', signal: ac ? ac.signal : undefined })
      .then(function (r) {
        clearTimeout(t)
        if (!r.ok || !/svg/.test(r.headers.get('content-type') || '')) return next()
        try { navigator.serviceWorker.controller.postMessage({ type: 'net-ok' }) } catch (e) { /* без воркера — ок */ }
        location.reload()
      }, function () { clearTimeout(t); next() })
  }
  setTimeout(probe, 800)
</script>
</body>
</html>
