  <!-- Тёмный узор (см. v2-ornament-dark.svg), размноженный на холст 1000x1000.
       Раньше тайлы стояли встык с зеркальным отражением соседа — на стыке
       завиток и его зеркальная копия складывались в симметричную фигуру
       (та самая "ласточка"/бабочка). Здесь ни одного зеркала (scale с минусом)
       вообще нет — только повороты на разные, специально не кратные 90
       градусы (0..350 вразнобой) и лёгкий разброс масштаба/позиции, россыпью
       по редкой сетке с нахлёстом. Одинаковый узор рядом со своим зеркалом
       никогда не встречается, поэтому симметричных стыков не возникает -->
  <rect width="1000" height="1000" fill="#b6fe3b"/>
  <defs>
    <g id="tile">
      <path d="M26 30 C28 18 44 14 54 22 C64 30 60 44 46 46 C34 48 25 41 26 30 Z"/>
