<!doctype html><html><head><meta charset="utf-8"><title>voice set runner</title></head><body><pre id="o">загрузка…</pre>
<script type="module">
// Прогон «Записи набора» (dev, в сборку не входит; ведёт scripts/voice-set-run.mjs, описание — CONCEPT_VOICESET.md): клип набора → поток микрофона → НАСТОЯЩИЙ слушатель игры на настоящей модели Vosk.
// Слово — wordLaneListen.js с правилом честного зачёта (earRule), как вертикальная пилюля «Пинг-понга» и стенда (цель — одно слово, expected 1, maxWords 2); фраза — racePhraseListen.js.
// Звук: один AudioContext страницы → MediaStreamDestination — это «микрофон» (getStream слушателя, как готовый поток игры). Клип играется как записан (громкость не нормируется); между клипами
// в поток идёт ПОДЛОЖКА — тишина из самого набора по кругу (настоящий шум того же микрофона): слушатель не видит ровного нуля и оценивает шум, как в игре. На время клипа подложка молчит.
// Усиление — как в игре: «Чувствительность микрофона» micGain (GainNode + ограничитель, voskGain.js) внутри слушателя, потом затвор и автоусиление движка.
// ПОПРАВКА ТРАКТА (hf: { env, chunkMs } из манифеста): клип хранится в 16 кГц — всё выше 8 кГц срезано, а слушатель игры меряет громкость куска по ВСЕЙ полосе микрофона (шум микрофона и
// шипящие заметно тише: белый шум теряет 40 % rms). Недостающую мощность каждого куска возвращает шум выше 9,5 кГц (Vosk его не слышит — сам пересчитывает звук в 16 кГц): громкость кусков,
// которую видит счётчик голоса, затвор и автоусиление, совпадает с исходной, а полоса речи остаётся записанной. Шум детерминированный (прогон повторяем).
// window.__init({ lang }) · __bed(url | null, hf) · __word({ wav, hf, target, micGain, ear, leadMs, tailMs }) · __phrase({ wav, hf, words, micGain, wordByWord, tailMs }). Времена — мс от начала клипа.
import { loadEngine, startListening, bufferRms } from '/src/shared/lib/vosk/voskEngine.js'
import { createWordListener } from '/src/features/player/modules/rotate-phone/wordLaneListen.js'
import { createPhraseListener } from '/src/features/pitrace/racePhraseListen.js'
import { loadPhones } from '/src/shared/lib/vosk/phones/phoneTable.js'

let model = null, actx = null, dest = null, mix = null, bedGain = null, bedSrc = null, tapPeak = 0, tapOn = false, taps = [], hfNoise = null
const sleep = ms => new Promise(r => setTimeout(r, ms))
const r5 = v => Math.round(v * 1e5) / 1e5
const runtime = { getModel: () => model, snapshot: () => ({}) }

function audio() {
  if (actx) return
  actx = new AudioContext(); dest = actx.createMediaStreamDestination(); mix = actx.createGain(); bedGain = actx.createGain()
  mix.connect(dest); bedGain.connect(mix)
  const tap = actx.createScriptProcessor(2048, 1, 1) // сырой уровень того, что ушло в «микрофон» (кусками как у движка) — сверка с rmsPeak манифеста
  tap.onaudioprocess = ev => { if (!tapOn) return; const v = bufferRms(ev.inputBuffer); tapPeak = Math.max(tapPeak, v); taps.push(v) }
  mix.connect(tap); tap.connect(actx.destination)
}
const HF_SEC = 30, HF_HZ = 9500
/** Шум выше 9,5 кГц с rms 1 (4 фильтра ВЧ подряд: на 8 кГц и ниже — глубже −24 дБ) — один раз на страницу */
async function makeHf() {
  const rate = actx.sampleRate, n = rate * HF_SEC, off = new OfflineAudioContext(1, n, rate), b = off.createBuffer(1, n, rate), d = b.getChannelData(0)
  let s = 20261111; for (let i = 0; i < n; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = (s / 0x7fffffff) * 2 - 1 }
  const src = off.createBufferSource(); src.buffer = b
  let last = src
  for (let k = 0; k < 4; k++) { const f = off.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = HF_HZ; f.Q.value = 0.707; last.connect(f); last = f }
  last.connect(off.destination); src.start()
  const y = (await off.startRendering()).getChannelData(0)
  let q = 0; for (let i = rate; i < n; i++) q += y[i] * y[i]
  const k = 1 / Math.sqrt(q / (n - rate))
  for (let i = 0; i < n; i++) y[i] *= k
  hfNoise = y
}
/** Клип + шум выше 9,5 кГц так, чтобы rms каждого куска стал как у исходного звука (hf.env — rms × 1e6 кусков длиной hf.chunkMs). → { buf, added — средняя добавка rms } */
function withHf(buf, hf) {
  if (!hf?.env?.length || !hfNoise) return { buf, added: 0 }
  const rate = buf.sampleRate, x = buf.getChannelData(0), step = hf.chunkMs / 1000 * rate, K = hf.env.length, a = new Float32Array(K)
  for (let k = 0; k < K; k++) {
    const from = Math.round(k * step), to = Math.min(x.length, Math.round((k + 1) * step)), full = hf.env[k] / 1e6
    let q = 0; for (let i = from; i < to; i++) q += x[i] * x[i]
    a[k] = Math.sqrt(Math.max(0, full * full - (to > from ? q / (to - from) : 0)))
  }
  const out = actx.createBuffer(1, x.length, rate), y = out.getChannelData(0), o = ((hf.seed ?? 0) * 104729) % hfNoise.length // сдвиг шума — по номеру клипа: прогон повторяем при любом порядке
  for (let i = 0; i < x.length; i++) { const p = i / step - 0.5, k0 = Math.max(0, Math.min(K - 1, Math.floor(p))), k1 = Math.min(K - 1, k0 + 1), f = Math.max(0, Math.min(1, p - k0)); y[i] = x[i] + hfNoise[(o + i) % hfNoise.length] * (a[k0] + (a[k1] - a[k0]) * f) }
  return { buf: out, added: Math.round(a.reduce((s, v) => s + v, 0) / K * 1e6) / 1e6 }
}
const decode = async (url, hf = null) => withHf(await actx.decodeAudioData(await (await fetch(url)).arrayBuffer()), hf)

window.__init = async ({ lang = 'en' } = {}) => {
  audio()
  model = (await loadEngine(await (await fetch(`/__model-${lang}.tar.gz`)).blob())).model
  if (lang === 'en') await loadPhones('en') // таблица произношений для фонетических ловушек — в приложении грузится вместе с английской моделью
  await makeHf()
  return { rate: actx.sampleRate }
}
window.__bed = async (url, hf = null) => {
  audio()
  try { bedSrc?.stop() } catch { /* не играла */ }
  bedSrc = null
  if (!url) return 0
  const { buf } = await decode(url, hf)
  bedSrc = actx.createBufferSource(); bedSrc.buffer = buf; bedSrc.loop = true; bedSrc.loopStart = 0.6; bedSrc.loopEnd = buf.duration - 0.1 // без предзаписи и самого хвоста
  bedSrc.connect(bedGain); bedSrc.start()
  return Math.round(buf.duration * 1000)
}
/** Сыграть клип в «микрофон»: подложка молчит, пока он звучит. → { T0 (performance.now начала клипа), durMs, done: Promise (клип кончился) } */
async function play(wav, hf) {
  const { buf, added } = await decode(wav, hf), at = actx.currentTime + 0.06, end = at + buf.duration
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(mix)
  bedGain.gain.setValueAtTime(1, at - 0.01); bedGain.gain.linearRampToValueAtTime(0, at); bedGain.gain.setValueAtTime(0, end); bedGain.gain.linearRampToValueAtTime(1, end + 0.01)
  tapPeak = 0; taps = []; tapOn = true
  src.start(at)
  return { T0: performance.now() + 60, durMs: Math.round(buf.duration * 1000), hfAdded: added, done: new Promise(r => { src.onended = () => { tapOn = false; r() } }) }
}
/** Фон на входе: среднее самых тихих 10 % кусков клипа (как rmsNoise манифеста); rms всего клипа — мера уровня, не зависящая от того, как куски легли на слово */
const tapNoise = () => { const s = taps.slice(1, -1).filter(v => v > 0).sort((a, b) => a - b), low = s.slice(0, Math.max(1, Math.round(s.length * 0.1))); return low.length ? r5(low.reduce((q, v) => q + v, 0) / low.length) : 0 }
const rmsOf = a => (a.length ? r5(Math.sqrt(a.reduce((q, v) => q + v * v, 0) / a.length)) : 0)

window.__word = async ({ wav, hf = null, target, micGain = 2, ear = true, leadMs = 350, tailMs = 1000 }) => {
  const res = { hit: false, hitAt: null, partials: [], finals: [], ear: [], gates: [], levels: [], status: [] }
  let T0 = null, l = null
  const rel = () => (T0 == null ? -1 : Math.round(performance.now() - T0))
  l = createWordListener({
    targets: [target], expected: 1, maxWords: 2, lang: 'en', getStream: () => dest.stream, isHeld: () => false, runtime, earRule: ear, micGain: () => micGain,
    onDebug: (k, d) => {
      if (T0 == null && k !== 'status') return
      if (k === 'partial') res.partials.push([rel(), d.raw])
      else if (k === 'ear') res.ear.push(`${rel()} ${d.text}`)
      else if (k === 'status') res.status.push([rel(), d.status])
    },
    listen: (m, g, cb, o) => startListening(m, g, {
      ...cb,
      onLevel: rms => { cb.onLevel(rms); if (T0 != null && performance.now() >= T0) res.levels.push([rel(), rms, l.voice.heard() ? 1 : 0]) },
      onResult: (t, st) => { if (T0 != null) res.finals.push({ t: rel(), text: t, by: st?.stopBy, words: (st?.words ?? []).map(w => ({ w: w.word, conf: Math.round(w.conf * 100) / 100 })), gatedMs: st?.gatedMs, voiceMs: st?.voiceMs, gatedVoiceMs: st?.gatedVoiceMs, agcMax: st?.agcMax, resultMs: st?.resultMs }); cb.onResult(t, st) },
    }, { ...o, onGate: (open, rms) => { if (T0 != null) res.gates.push([rel(), open ? 1 : 0]); o.onGate?.(open, rms) } }),
    onChange: st => { if (T0 != null && st.seq.includes(0) && !res.hit) { res.hit = true; res.hitAt = rel() } },
  })
  l.start()
  const t = performance.now()
  while (!res.status.some(s => s[1] === 'listening') && performance.now() - t < 6000) await sleep(20)
  await sleep(leadMs) // заход открыт: слушатель успевает оценить шум по подложке
  const p = await play(wav, hf)
  T0 = p.T0
  let ended = false; p.done.then(() => { ended = true })
  const until = T0 + p.durMs + tailMs
  while (performance.now() < until && !(res.hit && (ended || performance.now() - T0 - res.hitAt > 300))) await sleep(30)
  await sleep(120)
  l.dispose()
  const whole = ended // слушатель слышал клип целиком (иначе rms клипа у движка не сравнить)
  if (!ended) { await Promise.race([p.done, sleep(p.durMs)]) } // зачёт раньше конца клипа: дослушиваем клип, чтобы хвост не попал в следующий
  const voiced = res.levels.filter(x => x[2]), lv = res.levels.filter(x => x[0] <= p.durMs)
  const lastVoice = res.hit ? voiced.filter(x => x[0] <= res.hitAt).at(-1)?.[0] ?? null : null
  return {
    ...res, durMs: p.durMs, tapPeak: r5(tapPeak), tapNoise: tapNoise(), tapRms: rmsOf(taps), hfAdded: p.hfAdded, engPeak: r5(Math.max(0, ...lv.map(x => x[1]))), engRms: whole ? rmsOf(lv.map(x => x[1])) : null, engNoise: r5(Math.min(...lv.map(x => x[1]).filter(v => v > 0), 1)),
    voiceOn: voiced[0]?.[0] ?? null, voiceOff: voiced.at(-1)?.[0] ?? null, voiceMs: voiced.length ? Math.round(voiced.length * (res.levels.length > 1 ? (res.levels.at(-1)[0] - res.levels[0][0]) / (res.levels.length - 1) : 43)) : 0,
    afterVoiceMs: res.hit && lastVoice != null ? res.hitAt - lastVoice : null, levels: undefined,
  }
}

window.__phrase = async ({ wav, hf = null, words, micGain = 2, wordByWord = false, leadMs = 600, tailMs = 2600 }) => {
  const res = { hit: false, hitAt: null, ratio: null, heard: '', words: [], drafts: [], finals: [], log: [], error: null }
  let T0 = null, peak = 0, dur = Infinity
  const lv = []
  const rel = () => (T0 == null ? -1 : Math.round(performance.now() - T0))
  const l = createPhraseListener({
    phrases: [{ key: 'p', words }], lang: 'en', wordByWord, getStream: () => dest.stream, isHeld: () => false, log: t => { if (T0 != null) res.log.push(`${rel()} ${t}`) },
    create: o => createWordListener({ ...o, runtime, micGain: () => micGain }),
    onEar: e => { if (T0 == null) return; if (e.kind === 'partial' && e.text) res.drafts.push([rel(), e.text]); else if (e.kind === 'final') res.finals.push({ t: rel(), text: e.text }) },
    onLevel: rms => { if (T0 != null && performance.now() >= T0 && performance.now() - T0 <= dur) { peak = Math.max(peak, rms); lv.push(rms) } },
    onWord: w => { if (T0 != null && !w.gone && !res.words.includes(w.index)) res.words.push(w.index) },
    onPhrase: ph => { if (T0 != null && !res.hit) { res.hit = true; res.hitAt = rel(); res.ratio = ph.ratio; res.heard = ph.heard } },
    onError: st => { res.error = st },
  })
  await sleep(leadMs)
  const p = await play(wav, hf)
  T0 = p.T0; dur = p.durMs
  const until = T0 + p.durMs + tailMs
  while (performance.now() < until && !res.hit) await sleep(30)
  await sleep(150)
  l.stop()
  const whole = performance.now() - T0 >= p.durMs
  await Promise.race([p.done, sleep(p.durMs)])
  return { ...res, durMs: p.durMs, tapPeak: r5(tapPeak), tapNoise: tapNoise(), tapRms: rmsOf(taps), hfAdded: p.hfAdded, engPeak: r5(peak), engRms: whole ? rmsOf(lv) : null }
}
window.__ok = true
document.getElementById('o').textContent = 'готово'
</script></body></html>
