<body><div id="root"></div>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '/src/index.css'
import WordLaneTimelineEditor from '/src/features/canvas/word-lane/WordLaneTimelineEditor.jsx'

const v = fakeVoice()
window.__saved = null
createRoot(document.getElementById('root')).render(
  React.createElement('div', { className: 'tableEditorModal', style: { margin: 12, height: 'calc(100vh - 24px)' } },
    React.createElement(WordLaneTimelineEditor, {
