<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>timeline stand</title>
<style>body{margin:0;background:#0e1013;color:#fff;font-family:system-ui}</style></head>
<body><div id="root"></div>
<script type="module">
// Стенд «Таймлайна игры» (dev, в сборку не входит): экран features/timeline/TimelineScreen.jsx на фикстуре событий трассы, без сети и без игры.
//  • ?fixture=long — длинное прохождение (600 слов, ≈ 3000 событий: проверка, что в DOM не тысячи узлов); ?fixture=empty — игр на этом устройстве нет; ?fixture=rev — игра с разворотом конвейера и Мией;
//  • ?fixture=real — вырезка НАСТОЯЩЕЙ игры владельца с iPhone (timelineFixtureReal.js: первые ≈ 2 мин прохождения из журнала) — проверка «Монтажа» на реальных длинах звука и зазорах;
//  • ?tab=montage | pauses | ribbon | list — вкладка (по умолчанию: ширина окна от 900 px — «Монтаж», уже — «Паузы»); ?edit=1 — «Монтаж» сразу в режиме «✎ Правка».
//    Черновик правок хранится в localStorage этого стенда (ключ pithy.timeline.edits.<id прохождения>) — перезагрузка страницы его не теряет; ?server=1 — ещё и в подставном «сервере» (runs[i].edits);
//  • ?server=1 — подставной «сервер»: два сохранённых прохождения с других устройств (Android и iPhone), «☁ Сохранить на сервер» пишет в память страницы; ?server=empty — на сервере пусто;
//  • ?send=1 — подставная отправка в GitHub (кнопки «В GitHub» и «💬 Комментарий в GitHub» у блоков): файлы складываются в window.__sent; ?voices=1 — подставная озвучка (короткий тестовый звук у реплик Пита и Мии
//    и у русских слов диктора) — «▶ Слушать» и звук клипа по нажатию.
//  • ?lines=1 — подставные настройки реплик (в памяти страницы) и подставная озвучка: в карточке реплики работают правка текста, «Озвучить заново» (1,5 с «озвучки»), свой файл, «вернуть прежний текст»;
//    логика сохранения — настоящая (saveLineText, voicePitLines, setLineFile, restoreLine), подменены только сеть, ElevenLabs и R2. ?lines=deny — запись отклоняется, как у не-админа (RLS).
//  • ?fixture=knobs — та же настоящая игра, но С НАСТРОЙКАМИ ПАУЗ в трассе (timelineFixtureKnobs.js: события knob и pauses у стадий) — у зазоров видно, какая настройка их дала; ?fixture=real — «старая игра», настроек нет;
//    ?pauses=1 — подставной «сервер пауз» и память устройства (в памяти страницы): работают «попробовать на этом устройстве» и «применить для всех»; ?pauses=deny — запись для всех отклоняется (не админ);
//    ?pauses=srv — на сервере уже изменена одна настройка.
//    ?server=error — сеть недоступна; ?server=slow — ответ через 4 с (состояние загрузки). Без ?server — сервера нет (кнопок сервера нет).
import React from 'react'
import { createRoot } from 'react-dom/client'
import TimelineScreen from '/src/features/timeline/TimelineScreen.jsx'
import { fixtureEvents, longFixture } from '/src/features/timeline/timelineFixture.js'
import { reverseEvents, serverRuns } from '/src/features/timeline/timelineFixtureServer.js'
import { realEvents } from '/src/features/timeline/timelineFixtureReal.js'
import { knobEvents } from '/src/features/timeline/timelineFixtureKnobs.js'
import { validatePauses } from '/src/shared/lib/scenePauses.js'
import { packRun } from '/src/features/timeline/timelineStore.js'
import { normalizeLines, CAT_LINES } from '/src/features/player/modules/rotate-phone/wordLaneCatLines.js'
import { auditVoice } from '/src/features/admin/speech/voiceAudit.js'
import { saveLineText } from '/src/features/admin/speech/raceLineText.js'
import { setLineFile, restoreLine } from '/src/features/admin/speech/raceLineActions.js'
import { voicePitLines } from '/src/features/rehearsal/rehearsalVoice.js'

const q = new URLSearchParams(location.search), kind = q.get('fixture') || 'game', mode = q.get('server')
const events = kind === 'long' ? longFixture() : kind === 'rev' ? reverseEvents() : kind === 'real' ? realEvents() : kind === 'knobs' ? knobEvents() : fixtureEvents()
const AT = 1795000000000 // время старта прохождений стенда постоянное: id прохождения (ключ черновика правок) не меняется между перезагрузками
const runs = kind === 'empty' ? [] : [{ id: 1, at: AT - 600000, meta: { game: 'race', only: 'pingpong', seed: 'r0' }, events: longFixture(40), dropped: 0 }, { id: kind === 'real' ? 3 : kind === 'long' ? 4 : kind === 'rev' ? 5 : kind === 'knobs' ? 6 : 2, at: AT, meta: { game: 'race', only: 'stages', seed: 'r1' }, events, dropped: 0 }]
let value = { v: 1, runs: mode === '1' || mode === 'slow' ? serverRuns() : [] }
const wait = ms => new Promise(r => setTimeout(r, ms))
const server = mode ? {
  read: async () => { await wait(mode === 'slow' ? 4000 : 250); return mode === 'error' ? { runs: [], error: 'TypeError: Failed to fetch' } : { runs: value.runs, error: null } },
  save: async run => { await wait(250); if (mode === 'error') return { ok: false, error: 'TypeError: Failed to fetch' }; const mine = packRun(run); value = { v: 1, runs: [...value.runs.filter(r => r.id !== mine.id), mine].slice(-3) }; // как timelineApi.mergeRuns: то же id заменяется, остаются последние 3
    return { ok: true, bytes: JSON.stringify(value).length, count: value.runs.length } },
  saveEdits: async (run, draft) => { await wait(250); if (mode === 'error') return { ok: false, error: 'TypeError: Failed to fetch' }; const mine = run.savedAt ? run : packRun(run); value = { v: 1, runs: [...value.runs.filter(r => r.id !== mine.id), { ...mine, edits: draft }].slice(-3) }; window.__srvEdits = draft; return { ok: true } },
} : null
// тестовый звук: 1,2 с тона 440 Гц (WAV, data:URL) — виден ход проигрывания
const beep = () => { const sr = 8000, n = Math.round(sr * 1.2), b = new Uint8Array(44 + n), dv = new DataView(b.buffer); const w = (o, s) => [...s].forEach((c, i) => { b[o + i] = c.charCodeAt(0) }); w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true); for (let i = 0; i < n; i++) b[44 + i] = 128 + Math.round(40 * Math.sin(i * 2 * Math.PI * 440 / sr)); let s = ''; b.forEach(c => { s += String.fromCharCode(c) }); return `data:audio/wav;base64,${btoa(s)}` }
const voices = q.get('voices') ? { load: async () => { const url = beep(), ids = new Set(events.filter(e => e.k === 'line-start' && e.who !== 'dictor' && e.id !== 'race_good_ok').map(e => e.id)); // у race_good_ok озвучки нет — видно «нет озвучки (подпись)»
  return { lines: Object.fromEntries([...ids].map(id => [id, { text: '', url, duration: 1.2 }])), lib: new Map(events.filter(e => e.who === 'dictor' && /[а-яё]/i.test(e.text)).map(e => [`ru:${e.text.toLowerCase()}`, { url, duration: 1.2 }])) } } } : null
// подставные настройки реплик: всё, что звучит в игре, озвучено; у race_good_ok озвучки нет; у race_good_1 текст уже изменён после озвучки
const lmode = q.get('lines'), textOf = Object.fromEntries(CAT_LINES.map(d => [d.id, d.text]))
let rawLines = { lines: Object.fromEntries([...new Set(events.filter(e => e.k === 'line-start' && e.who !== 'dictor' && textOf[e.id] && e.id !== 'race_good_ok').map(e => e.id))].map(id => [id, { text: textOf[id], url: beep(), duration: 1.2, said: textOf[id] }])) }
if (rawLines.lines.race_good_1) rawLines.lines.race_good_1 = { ...rawLines.lines.race_good_1, text: 'отличное произношение, так держать', custom: true }
const ldeps = { load: async () => { await wait(150); return rawLines }, save: async v => { await wait(250); if (lmode === 'deny') throw new Error('Сохранение не применилось: сервер не подтвердил запись'); rawLines = v; window.__lines = v; return v } }
const fakeTts = { speak: async text => { await wait(1500); return { file: new File([text], 'tts.mp3', { type: 'audio/mpeg' }), wordTimings: [] } }, upload: async () => beep(), probe: async () => 1.2, loadVoice: async () => {} }
const lineApi = lmode ? { load: ldeps.load, normalize: normalizeLines, audit: raw => auditVoice(raw).byId, saveText: (id, text) => saveLineText(id, text, ldeps), voice: id => voicePitLines({ ids: [id], ...ldeps, ...fakeTts }),
  setFile: (id, file) => setLineFile(id, file, { ...ldeps, upload: fakeTts.upload, probe: fakeTts.probe }), restore: (id, prev) => restoreLine(id, prev, ldeps), copy: async t => { window.__copied = t; return true } } : null
// подставной «сервер пауз» и память устройства
const pmode = q.get('pauses')
let srvPauses = pmode === 'srv' ? { v: 1, pauses: { 'good.delay': 300 } } : null, devPauses = {}
const pauseApi = pmode ? { readServer: async () => { await wait(200); return { ok: true, value: srvPauses, error: null } },
  saveServer: async p => { await wait(400); if (pmode === 'deny') return { ok: false, error: 'Сохранение не применилось: сервер не подтвердил запись (нужны права админа)' }; srvPauses = { v: 1, pauses: validatePauses(p).pauses }; window.__srvPauses = srvPauses; return { ok: true, error: null } },
  readDevice: () => ({ pauses: devPauses }), saveDevice: obj => { devPauses = validatePauses(obj).pauses; window.__devPauses = devPauses; return { ok: true } } } : null
window.__sent = []
const send = q.get('send') ? async (comment, opts, report, edits, pinned = []) => { window.__sent.push({ comment, opts, report: report.length, edits, pinned }); await wait(300); return `Отправлено в GitHub (${2 + pinned.length} ф.) — напиши мне «читай»` } : null
createRoot(document.getElementById('root')).render(React.createElement(TimelineScreen, { runs, server, send, voices, lineApi, pauseApi, tab0: q.get('tab') || null, edit0: q.get('edit') === '1', onClose: () => { document.title = 'closed' } }))
</script></body></html>
