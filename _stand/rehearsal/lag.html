<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>rehearsal lag harness</title>
<style>body{margin:0;background:#0e1013;color:#fff;font-family:system-ui}#root{padding:12px}.aeHint{font-size:12px;color:#888}</style></head>
<body><div id="root"></div>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '/src/index.css'
import '/src/styles/admin-speech.css'
import RehearsalPolishBlock from '/src/features/admin/speech/RehearsalPolishBlock.jsx'
import { supabase } from '/src/shared/api/supabase.js'
import { listWordAudio } from '/src/shared/lib/wordAudio/wordAudioApi.js'
import { wordKey } from '/src/shared/lib/wordAudio/wordKey.js'
import { voskRuntime } from '/src/shared/lib/vosk/voskRuntime.js'
import { FIXTURE_IDS, fixturePlan } from '/src/features/rehearsal/rehearsalFixtures.js'
import { planTexts } from '/src/features/rehearsal/rehearsalPlan.js'
import { REHEARSAL_LINES } from '/src/features/rehearsal/rehearsalLines.js'

// Стенд «лаги читки» (dev, в сборку не входит): настоящий блок «Шлифовка репетиции» с настоящей игрой, как у владельца на iPhone: библиотека слов и ВСЕ реплики Пита ОЗВУЧЕНЫ (WAV 22 кГц),
// поэтому тап «Запустить» честно качает, декодирует и измеряет все файлы (prepareWords). Модель Vosk — заглушка (тап вместо речи: pithy_wl_tap_v1=1). ?voice=0 — без озвучки. Сценарий замеров — scratchpad/lag/lag.cjs.
const qs = new URLSearchParams(location.search)
const voice = qs.get('voice') !== '0'
const net = qs.get('net') === '1' // файлы по адресу /__lag/<мс>.wav: сценарий замеров отдаёт их с задержкой сети (как R2)
let seq = 0
const wav = ms => {
  const rate = 22050, lead = 0.06, sec = lead + ms / 1000, n = Math.floor(rate * sec)
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf)
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)))
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true)
  for (let i = 0; i < n; i++) { const t = i / rate; v.setInt16(44 + i * 2, t >= lead ? Math.round(Math.sin(2 * Math.PI * 330 * t) * 9000) : 0, true) }
  return { url: net ? `/__lag/${ms}-${++seq}.wav` : URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })), duration: sec }
}
const texts = [...new Set(FIXTURE_IDS.flatMap(id => planTexts(fixturePlan(id))))]
const rows = voice ? texts.map(text => ({ key: wordKey(text), text, ...wav(300 + 60 * text.replace(/\s/g, '').length) })).filter(r => r.key) : []
const lines = voice ? Object.fromEntries(REHEARSAL_LINES.map(l => { const a = wav(1800 + 40 * l.text.length); return [l.id, { text: l.text, url: a.url, duration: a.duration, words: null }] })) : {}
supabase.from = table => ({ select: () => ({ eq: () => (table === 'word_audio' ? Promise.resolve({ data: rows, error: null }) : { maybeSingle: () => Promise.resolve({ data: { value: { lines } }, error: null }) }) }) })
await listWordAudio()
window.__standInfo = { words: rows.length, lines: Object.keys(lines).length }
class Rec { constructor() { this.h = {} } setWords() {} on(ev, cb) { this.h[ev] = cb } remove() {} acceptWaveform() {} retrieveFinalResult() {} }
voskRuntime.acquire = () => () => {}
voskRuntime.whenSettled = async () => ({ ok: true })
voskRuntime.warmNow = () => {}
voskRuntime.getModel = () => ({ KaldiRecognizer: Rec })
createRoot(document.getElementById('root')).render(React.createElement('div', { className: 'aeWrap' }, React.createElement('p', { className: 'aeHint' }, 'Голос (проба распознавания речи)'), React.createElement(RehearsalPolishBlock)))
</script></body></html>
