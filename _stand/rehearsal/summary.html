<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>rehearsal summary harness</title>
<style>body{margin:0;background:#0e1013}</style></head>
<body><div id="root"></div>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '/src/index.css'
import RehearsalSummary from '/src/features/rehearsal/RehearsalSummary.jsx'
import { fixturePlan } from '/src/features/rehearsal/rehearsalFixtures.js'

// Стенд итога репетиции (dev, в сборку не входит): окно «хочешь ещё» (RehearsalSummary) на сцене .wlStage без игры. ?again=0 — следующего плана нет (одна кнопка «Готово»); ?lite=1 — слабое устройство (затухание вместо полёта).
// Уход проверяется как в игре: «Нет» → окно улетает, дети .wlStage опускаются и тают, через ~600 мс window.__done = 'finished'. Декорации сцены — цветные плашки вместо пилюль и кота.
const params = new URLSearchParams(location.search)
const plan = fixturePlan('three')
const result = { xp: 2, capped: false, tempo: 1.3, note: { key: 'tempo', text: 'Ты медленнее меня на 30 %.' } }
window.__done = null
const dummy = (i, color) => React.createElement('div', { key: i, style: { left: `${8 + i * 31}%`, top: '18%', width: '22%', height: '24%', borderRadius: 999, background: color, opacity: 0.9 } })
const app = React.createElement('div', { className: 'wl' },
  React.createElement('div', { className: 'wlStage' },
    ['#b6fe3b', '#4fb3ee', '#9a76f8'].map(dummy),
    React.createElement('div', { style: { left: '10%', bottom: '4%', width: '40%', height: '14%', borderRadius: 24, background: '#9a76f8' } }),
    React.createElement(RehearsalSummary, { plan, result, onAgain: params.get('again') === '0' ? null : () => { window.__again = (window.__again || 0) + 1 }, onDone: () => { window.__done = 'finished' } })))
createRoot(document.getElementById('root')).render(app)
</script></body></html>
