<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>race harness</title>
<style>body{margin:0;background:#0e1013;color:#fff;font-family:system-ui}#root{padding:16px}</style></head>
<body><div id="root"></div>
<script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import '/src/index.css'
import RotatePhoneModule from '/src/features/player/modules/rotate-phone/RotatePhoneModule.jsx'
import { supabase } from '/src/shared/api/supabase.js'
import { listWordAudio } from '/src/shared/lib/wordAudio/wordAudioApi.js'
import { wordKey } from '/src/shared/lib/wordAudio/wordKey.js'
import { transKey } from '/src/features/pitrace/raceTrans.js'
import { voskRuntime } from '/src/shared/lib/vosk/voskRuntime.js'
import { voskRuntimeRu } from '/src/shared/lib/vosk/voskRuntimes.js'
import { fixtureSource, fixturePlan } from '/src/features/rehearsal/rehearsalFixtures.js'
import { raceTexts } from '/src/features/pitrace/raceTexts.js'
import { extrasOf, catchWords, climbWords, sprintWords } from '/src/features/pitrace/raceWords.js'
import { normalizePlan } from '/src/features/rehearsal/rehearsalPlan.js'
import { RACE_LINES } from '/src/features/pitrace/raceLines.js'
import { PHRASE_FIXTURE } from '/src/features/pitrace/racePhraseFixture.js'
import { phrasesOf, withPhrases } from '/src/features/pitrace/racePhraseData.js'
import { round1Turns } from '/src/features/pitrace/racePhraseTurns.js'
import { setPhraseListener } from '/src/features/pitrace/racePhraseListener.js'
import { summaryStand } from './summaryStand.js'
import { createPhraseListener as stubPhraseListener, stubSay, stubDraft } from '/src/features/pitrace/racePhraseListenStub.js'

// Стенд «Встряхни память» («Гонка с Питом», dev, в сборку не входит): настоящие раунды гонки на игре «Повтори за диктором» без входа, Supabase и телефона.
//  • ?ask=voice|tap — ответ на попап «Говорю / Тапаю» внутри игры (по умолчанию voice), ?ask=none — стоять на попапе; ?lines=1 — реплики Пита с озвучкой (гудки);
//  • этап «Фразы»: plan.phrases — фикстура racePhraseFixture.js (3 свои + 1 дежурная, audio: null; ?phrases=0 — без фраз; ?whole=1 — целые записи фраз в word_audio, ключ phrase:<key>), ?only=phrases — один этап; слушатель фраз — подставной, речь драйвер подаёт window.__phraseSay('слова');  //  (+?only=phrases — один этап; слушатель фраз — подставной, речь драйвер подаёт window.__phraseSay('слова') (черновиком — window.__phraseDraft);)
//  • ?meaning=1 — смысл (ru) и ситуация (scene) фраз этапа 2 озвучены гудком ≈ 2 с (реплика Пита перед ходом «Скажи» со звуком — ранний выезд пилюли, racePhraseEarly.js)
//  • ?mute=later,see — этих слов нет в библиотеке word_audio: демо «Скажи» не берёт запасную фразу с неозвученным словом (racePhraseWordVoice.js), журнал «[phrase-voice] слово … без озвучки»
//  • ?fixture=three|two|one|none — план из фикстур; ?seed=… — семя случайностей; ?only=sprint|catch|climb|descent — один раунд, ?only=stages — «Пинг-понг + фразы + финал», ?only=pingpong — «Пинг-понг + финал»; ?only=summary — сразу экран итога с фикстурой (summaryStand.js); ?ru=0 — русская модель не скачана (проход B на тапе) (иначе полная гонка);
//  • озвучка слов и кусков — синтетические гудки (wav ниже), реплики Пита без озвучки (подпись без звука); ?voice=0 — и слова без озвучки;
//  • Vosk — заглушка: речь подаёт драйвер очередью window.__sayQueue (строки «слова через пробел»): следующий кусок звука микрофона закрывает заход с этим текстом — как итог Vosk; window.__partialQueue — только черновик (partial) без итога; тап вместо речи (localStorage pithy_wl_tap_v1=1) работает как обычно.
//  • Vosk — заглушка: речь подаёт драйвер очередью window.__sayQueue (строки «слова через пробел»): следующий кусок звука микрофона закрывает заход с этим текстом — как итог Vosk («~слова» — только черновик partial, заход не закрывается); тап вместо речи (localStorage pithy_wl_tap_v1=1) работает как обычно.
const params = new URLSearchParams(location.search)
const fixture = params.get('fixture') || 'three'
const voice = params.get('voice') !== '0'
const askParam = params.get('ask') || 'voice' // попап «Говорю / Тапаю» внутри игры проходится сам: ?ask=voice|tap; ?ask=none — остановиться на попапе (для снимков)

const wav = ms => { // лидирующая тишина 80 мс + гудок ms мс, 8 кГц
  const rate = 8000, lead = 0.08, sec = lead + ms / 1000, n = Math.floor(rate * sec)
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf)
  const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)))
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true)
  for (let i = 0; i < n; i++) { const t = i / rate; v.setInt16(44 + i * 2, t >= lead ? Math.round(Math.sin(2 * Math.PI * 330 * t) * 9000) : 0, true) }
  return { url: URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })), duration: sec }
}

const plan = { ...fixtureSource(fixture), game: 'race', ...(params.get('seed') ? { seed: params.get('seed') } : {}), ...(params.get('only') ? { round: params.get('only') } : {}) }
plan.extraWords = extrasOf(fixturePlan(fixture))
if (params.get('phrases') !== '0') plan.phrases = PHRASE_FIXTURE
setPhraseListener(stubPhraseListener); window.__phraseSay = stubSay; window.__phraseDraft = stubDraft // фразы «говорит» драйвер
const mute = new Set((params.get('mute') || '').split(',').map(wordKey).filter(Boolean)) // ?mute=later,see — этих слов нет в библиотеке word_audio (как у владельца: слова запасной фразы не озвучены)
const texts = raceTexts({ ...fixturePlan(fixture), extraWords: plan.extraWords })
const rows = voice ? texts.map(text => ({ key: wordKey(text), ...wav(180 + 70 * text.replace(/\s/g, '').length) })).filter(r => r.key && !mute.has(r.key)) : []
if (voice && params.get('meaning') === '1') PHRASE_FIXTURE.forEach(p => { for (const t of [p.ru, p.scene]) if (t) rows.push({ key: transKey(t), ...wav(1600 + 20 * t.length) }) }) // ?meaning=1 — смысл и ситуация фраз озвучены (гудок ≈ 2 с): видно, что пилюля «Скажи» выезжает вместе с репликой Пита
if (voice && params.get('whole') === '1') PHRASE_FIXTURE.forEach(p => rows.push({ key: `phrase:${p.key}`, ...wav(900 + 40 * p.text.length) })) // ?whole=1 — фразы этапа 2 озвучены целиком (word_audio phrase:<key>, гудок)
// ?lines=1 — реплики Пита тоже с озвучкой (гудки): виден путь «буфер реплики декодирован в «Начать» → звук сразу после входа в игру» (журнал «[race] старт: реплика через M мс после входа в игру»)
const catLines = params.get('lines') === '1' ? { lines: Object.fromEntries(RACE_LINES.map(l => { const w = wav(400 + 25 * l.text.length); return [l.id, { text: l.text, url: w.url, duration: w.duration }] })) } : null
supabase.from = table => ({ select: () => ({ eq: () => (table === 'word_audio' ? Promise.resolve({ data: rows, error: null }) : { maybeSingle: () => Promise.resolve({ data: table === 'app_settings' && catLines ? { value: catLines } : null, error: null }) }) }) })
await listWordAudio()

// Модель Vosk: готова сразу; заход закрывается текстом из очереди window.__sayQueue (следующая порция звука микрофона), пустая очередь — тишина
window.__sayQueue = []
window.__partialQueue = [] // черновики Vosk без итога: драйвер подаёт partial (shoot-jitter.mjs)
class Rec {
  constructor() { this.h = {}; this.ended = false }
  setWords() {}
  on(ev, cb) { this.h[ev] = cb }
  remove() {}
  acceptWaveform() {
    if (!this.ended && window.__partialQueue.length) { this.h.partialresult?.({ result: { partial: window.__partialQueue.shift() } }); return } // только черновик (недоговорённое / чужое слово на ходу), заход не закрывается
    if (this.ended || !window.__sayQueue.length) return
    const text = window.__sayQueue.shift(), words = text.split(' ').filter(Boolean)
    if (text.startsWith('~')) { window.__partialAt = performance.now(); this.h.partialresult?.({ result: { partial: text.slice(1) } }); return } // черновик без итога (замер заливки)
    this.ended = true
    this.h.partialresult?.({ result: { partial: text } })
    this.h.result?.({ result: { text, result: words.map((w, i) => ({ word: w, conf: 1, start: +(i * 0.3).toFixed(2), end: +(i * 0.3 + 0.25).toFixed(2) })) } })
  }
  retrieveFinalResult() { if (!this.ended) { this.ended = true; this.h.result?.({ result: { text: '', result: [] } }) } }
}
voskRuntime.acquire = () => () => {}
voskRuntime.whenSettled = async () => ({ ok: true })
voskRuntime.warmNow = () => {}
voskRuntime.getModel = () => ({ KaldiRecognizer: Rec })
voskRuntime.evict = () => true; voskRuntime.expect = () => {}
// Русская модель: тоже заглушка (?ru=0 — «не скачана», проход B пойдёт тапом); переключение моделей отрабатывает по-настоящему (evict / acquire / expect), модель-заглушка отдаётся сразу
for (const k of ['acquire']) voskRuntimeRu[k] = () => () => {}
voskRuntimeRu.whenSettled = async () => ({ ok: true }); voskRuntimeRu.warmNow = () => {}; voskRuntimeRu.evict = () => true; voskRuntimeRu.expect = () => {}
voskRuntimeRu.checkCached = async () => params.get('ru') !== '0'
voskRuntimeRu.getModel = () => ({ KaldiRecognizer: Rec })

const node = { id: 'race-stand', type: 'rotate_phone', isHistory: false, typeData: { rotate_phone: { plan } } }
window.__done = null
const np = withPhrases(normalizePlan(plan), plan) // для драйвера скриншотов (shoot.mjs): слова раундов по тому же плану и семени
window.__race = { sprint: sprintWords(np), catches: catchWords(np), climb: climbWords(np), chunks: np.chunks, phrases: phrasesOf(np), turns1: round1Turns(phrasesOf(np), np.seed) }
if (params.get('only') === 'summary') createRoot(document.getElementById('root')).render(summaryStand()) // ?only=summary — сразу экран итога (summaryStand.js)
else createRoot(document.getElementById('root')).render(React.createElement(RotatePhoneModule, { node, file: null, forceDebug: true, askAuto: ['voice', 'tap'].includes(askParam) ? askParam : null, onDone: v => { window.__done = v } }))
</script></body></html>
